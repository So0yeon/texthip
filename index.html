<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>READ ME · 문학 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'KyoboHandwriting2025lyb';
    src: url('assets/KyoboHandwriting2025lyb.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'OksuniSNostalgicHandwriting';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-oksooni-rg/griun-oksooni-rg/Griun_Oksooni-Rg.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'NostalgicOnHandwriting';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-onhandwriting-rg/griun-onhandwriting-rg/Griun_OnHandwriting-Rg.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'HandwritingAsOne';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/naverfont_01@1.0/Become_one.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'KotraHandwritingFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/KOTRA_SONGEULSSI.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
:root{
  --paper:#F3EFE6; --kraft:#D8CBB5; --ink:#38342F; --gray:#8A8379; --olive:#7d7a55; --plum:#8a6a78;
  --hand:'KyoboHandwriting2025lyb','Nanum Pen Script','Gaegu','Segoe Print','Apple SD Gothic Neo',cursive;
  --body:'Nanum Myeongjo','Noto Serif KR','Batang','AppleMyungjo',serif;
  --type:'Special Elite','Courier New',monospace;
  --cover:#D8CBB5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); color:var(--ink); font-size:16px; line-height:1.7;
  background-color:#c9bb9f;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .19  0 0 0 0 .15  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  min-height:100vh; padding:18px 12px 40px;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.hand{font-family:var(--hand);font-weight:400;letter-spacing:.01em}
.type{font-family:var(--type)}
.sr{position:absolute;left:-9999px}

/* binder */
.wrap{max-width:1220px;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--type);font-size:20px;letter-spacing:.14em;transform:rotate(-1deg);display:inline-block;border:0;background:none;padding:0;text-align:left;transition:opacity .15s}
.logo:hover{opacity:.72}
.logo small{font-family:var(--hand);font-size:20px;letter-spacing:0;margin-left:10px;color:#4a443d}
.notice{font-size:12.5px;color:#4a443d;font-family:var(--body)}
.book{display:flex;background:var(--cover);border-radius:8px 14px 14px 8px;padding:14px 0 14px 14px;position:relative;
  box-shadow:0 2px 0 #b3a68d,0 10px 22px rgba(56,52,47,.28);border:1.5px solid #8f8470}
.book.c-ink{--cover:#4a453f}
.book.reading-friend{outline:3px solid var(--plum);outline-offset:4px}
.book.c-ink .tab{color:var(--ink)}
.book.c-paper{--cover:#e7e0d0}
.spread{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative;min-width:0;transition:opacity .25s,transform .25s}
.spread.turn{animation:turn .28s ease}
@keyframes turn{from{opacity:.2;transform:translateX(10px)}to{opacity:1;transform:none}}
.page{color:var(--ink);position:relative;min-height:690px;padding:30px 34px 36px;background:var(--paper);overflow:hidden;min-width:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>")}
.page.L{border-radius:6px 0 0 6px;box-shadow:inset -22px 0 24px -22px rgba(56,52,47,.35)}
.page.R{border-radius:0 6px 6px 0;box-shadow:inset 22px 0 24px -22px rgba(56,52,47,.35)}
.paper-lined .page{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(56,52,47,.14) 31px 32px),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");background-position:0 22px,0 0}
.paper-grid .page{background-image:linear-gradient(rgba(56,52,47,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(56,52,47,.1) 1px,transparent 1px),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");background-size:26px 26px,26px 26px,auto}
.rings{position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#f3efe6 0 5px,#4a443d 5.5px 7px,#bdb29c 7.5px 9px,transparent 9.5px) 0 0/30px 52px repeat-y}
.bind-twin .rings{width:34px;background:radial-gradient(circle at 30% 50%,#f3efe6 0 3px,#4a443d 3.5px 4.6px,transparent 5px) 0 0/34px 18px repeat-y,radial-gradient(circle at 70% 50%,#f3efe6 0 3px,#4a443d 3.5px 4.6px,transparent 5px) 0 0/34px 18px repeat-y}
.bind-coil .rings{width:26px;background:repeating-linear-gradient(-58deg,transparent 0 6px,#4a443d 6px 8.5px,#bdb29c 8.5px 10px,transparent 10px 13px)}
.bind-stitch .rings{width:10px;background:linear-gradient(90deg,transparent 3px,rgba(56,52,47,.18) 3px 7px,transparent 7px),repeating-linear-gradient(to bottom,#8a6a58 0 11px,transparent 11px 20px) 50% 0/2px 100% no-repeat}
.bind-stitch .rings::before{display:none}
.bind-none .rings{width:14px;background:linear-gradient(90deg,transparent,rgba(56,52,47,.22) 45%,rgba(56,52,47,.22) 55%,transparent)}
.bind-none .rings::before{display:none}
.paper-dot .page{background-image:radial-gradient(rgba(56,52,47,.22) 1.1px,transparent 1.5px);background-size:22px 22px}
/* 꾸미기 */
.pin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#F3EFE6;font-family:var(--body);font-size:12px;font-weight:700;flex:none}
.where{font-size:12.5px;color:#6a6358;margin:-2px 0 8px 30px}
.deco-sec{margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 4px;min-width:64px;background:rgba(255,253,247,.55);border:1.4px solid rgba(56,52,47,.25);border-radius:8px;font-size:12.5px;color:var(--ink);transition:transform .12s,border-color .12s}
.opt-btn:hover{transform:translateY(-2px);border-color:var(--ink)}
.opt-btn.on{border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(56,52,47,.35);background:#fffdf7}
.opt-btn.on span::before{content:"✓ "}
.sw{display:block;width:34px;height:34px;border-radius:50%;border:1.4px solid rgba(56,52,47,.45)}
.sw.sq{border-radius:4px;width:40px;height:30px}
.pat{display:block;width:44px;height:34px;border:1.2px solid rgba(56,52,47,.35);border-radius:3px;background-color:var(--paper)}
.pat.paper-lined{background-image:repeating-linear-gradient(to bottom,transparent 0 7px,rgba(56,52,47,.3) 7px 8px)}
.pat.paper-grid{background-image:linear-gradient(rgba(56,52,47,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(56,52,47,.22) 1px,transparent 1px);background-size:8px 8px}
.pat.paper-dot{background-image:radial-gradient(rgba(56,52,47,.45) 1px,transparent 1.3px);background-size:8px 8px}
.bnd{display:block;position:relative;width:52px;height:38px;background:var(--paper);border:1.2px solid rgba(56,52,47,.35);border-radius:3px;overflow:hidden}
.bnd .rings{transform:translateX(-50%) scale(.7);transform-origin:50% 0;height:150%}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.font-card{text-align:left;padding:8px 10px;background:rgba(255,253,247,.55);border:1.4px solid rgba(56,52,47,.25);border-radius:8px;color:var(--ink)}
.font-card b{display:block;font-size:22px;font-weight:400;line-height:1.1}
.font-card span{font-size:16px;color:#5a534a}
.font-card.on{border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(56,52,47,.35);background:#fffdf7}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,253,247,.55);border:1.4px solid rgba(56,52,47,.25);border-radius:8px;color:var(--ink);text-align:left}
.theme b{font-weight:400;font-size:19px}
.theme.on{border:2px solid var(--ink);background:#fffdf7}
.tchip{width:34px;height:40px;border-radius:3px 6px 6px 3px;padding:5px 4px 5px 8px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.15)}
.tchip i{display:block;width:100%;height:100%;border-radius:2px}
.mini-wrap{position:relative;margin:14px 6px 8px;padding:26px 54px 26px 4px}
.mini{display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--cover);border-radius:6px 10px 10px 6px;padding:9px 9px 9px 11px;box-shadow:0 6px 14px rgba(56,52,47,.25);transition:background .2s}
.mini-page{position:relative;min-height:150px;padding:14px 14px;background-color:var(--paper);overflow:hidden}
.mini-page.L{border-radius:4px 0 0 4px}.mini-page.R{border-radius:0 4px 4px 0}
.mini.paper-lined .mini-page{background-image:repeating-linear-gradient(to bottom,transparent 0 17px,rgba(56,52,47,.16) 17px 18px)}
.mini.paper-grid .mini-page{background-image:linear-gradient(rgba(56,52,47,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(56,52,47,.12) 1px,transparent 1px);background-size:14px 14px}
.mini.paper-dot .mini-page{background-image:radial-gradient(rgba(56,52,47,.3) 1px,transparent 1.3px);background-size:12px 12px}
.mini .rings{display:block;transform:translateX(-50%) scale(.6);transform-origin:50% 0;height:166%}
.mini-title{font-size:22px;line-height:1.1;margin-bottom:8px}
.mini-line{font-size:17px;line-height:1.2;color:#4a443d}.mini-line.s{font-size:15px;margin-top:4px}
.mini-q{font-family:var(--body);font-size:12.5px;line-height:1.6;color:#4a443d}
.callout{position:absolute;display:flex;align-items:center;gap:4px;font-size:12px;color:#4a443d;background:rgba(255,253,247,.85);padding:1px 6px 1px 2px;border-radius:12px;white-space:nowrap}
.callout .pin{width:17px;height:17px;font-size:10px}
.c1{left:0;top:2px}.c2{left:36%;top:2px}.c3{left:40%;bottom:2px}.c4{left:4px;bottom:2px}
.mini-spine{position:absolute;right:4px;top:18px;width:30px;height:150px;border:1.5px solid var(--ink);border-radius:2px;writing-mode:vertical-rl;font-family:var(--hand);font-size:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:2px 2px 0 rgba(56,52,47,.3)}
.rings::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(56,52,47,.25);transform:translateX(-50%)}
.tabs{display:flex;flex-direction:column;gap:6px;padding-top:34px;width:auto;min-width:66px;flex:none}
.tab{border:1.5px solid #6e6454;border-left:0;background:#e9e2d2;padding:10px 12px 10px 10px;border-radius:0 9px 9px 0;font-family:var(--hand);font-size:18px;line-height:1.1;text-align:center;white-space:nowrap;word-break:keep-all;
  box-shadow:1px 1px 0 rgba(56,52,47,.25);transition:transform .15s,margin .15s;margin-left:-2px;color:var(--ink);width:100%}
.tab:nth-child(2n){background:#dfd5bf}.tab:nth-child(3n){background:#ece6d8}
.tab:hover{transform:translateX(3px)}
.tab.on{background:var(--paper);transform:translateX(0);margin-left:-4px;font-weight:700;border-color:var(--ink)}
.pager{display:none}

/* typography bits */
h1,h2,h3{font-weight:400;margin:0}
.ptitle{font-family:var(--hand);font-size:40px;line-height:1.05;display:inline-block;transform:rotate(-1.2deg);margin:0 0 4px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='8' viewBox='0 0 200 8'><path d='M1 5 C 30 1, 60 7, 95 4 S 160 2, 199 5' fill='none' stroke='%2338342F' stroke-width='1.8' stroke-linecap='round'/></svg>") left bottom/100% 8px no-repeat;padding-bottom:7px}
.sub{font-family:var(--hand);font-size:22px;color:#5d564d;margin:4px 0 12px}
.h3{font-family:var(--hand);font-size:27px;margin:16px 0 6px;display:flex;align-items:center;gap:8px;line-height:1.1}
.h3 .more{font-family:var(--body);font-size:12px;margin-left:auto;border:0;background:none;text-decoration:underline;color:var(--gray);padding:0}
.small{font-size:13px;color:var(--gray)}
.pen{color:#4b453e}
.sep{border:0;border-top:1.5px dashed #a89e8b;margin:14px 0}

/* paper bits */
.note{background:#fbf8f0;border:1px solid #cbbfa8;padding:12px 14px;margin:10px 4px;position:relative;box-shadow:1px 2px 0 rgba(56,52,47,.18),0 6px 8px -6px rgba(56,52,47,.35);transform:rotate(var(--r,0deg))}
.note.kraft{background:var(--kraft);border-color:#bba98a}
.note.card{background:#fffdf7;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(56,52,47,.1) 27px 28px);background-position:0 36px;border-top:3px double #c77;border-top-color:#a8685f}
.note.torn{clip-path:polygon(0 3%,4% 0,9% 2%,15% 0,22% 3%,30% 0,38% 2%,47% 0,55% 3%,64% 0,72% 2%,81% 0,90% 3%,100% 0,100% 100%,0 100%)}
.note.click{cursor:pointer;transition:transform .15s}
.note.click:hover{transform:rotate(0deg) translateY(-2px)}
.note.sel{outline:2px solid var(--ink);outline-offset:2px}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:20px;background:rgba(190,176,148,.72);border:1px solid rgba(120,106,80,.35);transform:translateX(-50%) rotate(-3deg);
  clip-path:polygon(0 0,100% 6%,97% 50%,100% 94%,0 100%,3% 50%)}
.tape.l{left:24px;transform:rotate(-8deg)}
.qt{font-family:var(--body);font-size:17px;line-height:1.75}
.cite{font-size:13px;color:#5f584f;margin-top:6px}
.tag{display:inline-block;font-family:var(--hand);font-size:18px;border:1.4px solid var(--ink);border-radius:12px 14px 11px 15px;padding:0 9px;margin:0 5px 4px 0;line-height:1.35;background:transparent;color:var(--ink)}
button.tag.on{background:var(--ink);color:var(--paper)}
.tag.tgl{cursor:pointer;user-select:none;transition:background .12s}
.tag.tgl:hover{background:rgba(56,52,47,.08)}
.tag.tgl.on{background:var(--ink);color:#F3EFE6}
input.sr:focus-visible+.tag.tgl{outline:2px solid var(--ink);outline-offset:2px}
.badge{display:inline-block;font-size:11px;border:1px dashed var(--gray);padding:0 6px;color:#6a6358;margin-left:4px;vertical-align:middle;border-radius:3px;font-family:var(--body)}
.btn{font-family:var(--hand);font-size:21px;line-height:1.1;background:#efe7d4;border:1.6px solid var(--ink);border-radius:5px 9px 6px 10px/9px 5px 10px 6px;padding:5px 13px 4px;box-shadow:2px 2px 0 rgba(56,52,47,.55);transition:transform .1s,box-shadow .1s;margin:2px 4px 4px 0;color:var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(56,52,47,.55)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.sm{font-size:18px;padding:2px 9px 1px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--gray);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:2px dashed #a89e8b;padding:18px;text-align:center;color:#6a6358;margin:10px 4px;border-radius:4px}
.empty .hand{font-size:24px;display:block;margin-bottom:6px}
.avatar{width:74px;height:74px;border:2px solid var(--ink);border-radius:50% 46% 52% 48%;background:#efe7d4;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:2px 2px 0 rgba(56,52,47,.4)}
.avatar svg{width:80%;height:80%}
.avatar.sm{width:44px;height:44px}
.me-head{display:flex;gap:16px;align-items:center}
.nick{font-family:var(--hand);font-size:38px;line-height:1}
.bio{font-family:var(--hand);font-size:22px;color:#5a534a;line-height:1.2;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pimg{display:block;flex:none;object-fit:cover;image-rendering:pixelated;border:1.6px solid var(--ink);border-radius:4px;background:#fbf8f0}
.persona-stamp{border:2px solid var(--ink);padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;transform:rotate(-1deg);background:#efe7d4;margin:8px 4px;border-radius:3px}
.persona-stamp b{font-family:var(--hand);font-size:26px;font-weight:400}

/* forms / modal */
label{display:block;font-family:var(--hand);font-size:21px;margin:10px 0 2px}
label .opt{font-family:var(--body);font-size:12px;color:var(--gray);margin-left:6px}
label .req{color:#8a4d44;margin-left:3px}
input[type=text],input[type=search],input[type=date],textarea,select{width:100%;font:inherit;font-size:15.5px;background:rgba(255,253,247,.85);border:1.5px solid var(--ink);border-radius:3px 6px 3px 5px;padding:7px 10px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(40,36,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.overlay[hidden]{display:none}
.sheet{background:var(--paper);border:2px solid var(--ink);max-width:560px;width:100%;padding:22px 24px 20px;box-shadow:6px 6px 0 rgba(0,0,0,.35);position:relative;transform:rotate(-.4deg)}
.sheet h3{font-family:var(--hand);font-size:34px;line-height:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;font-family:var(--hand);font-size:22px;border-radius:4px 10px 5px 9px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast::before{content:"✓ ";}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0;max-height:370px;overflow:auto;padding:4px 4px 8px}
.msg{max-width:88%;padding:8px 12px;border:1.4px solid var(--ink);background:#fffdf7;position:relative;font-size:15.5px;line-height:1.65}
.msg.me{align-self:flex-end;background:var(--kraft);border-radius:10px 3px 10px 10px}
.msg.ch{align-self:flex-start;border-radius:3px 10px 10px 10px}
.msg .who{font-family:var(--hand);font-size:17px;color:#6a6358;display:block;line-height:1}
.star{position:absolute;right:-8px;top:-10px;background:var(--paper);border:1.4px solid var(--ink);border-radius:50%;width:26px;height:26px;line-height:20px;padding:0;font-size:15px}
.star.on{background:var(--ink);color:var(--paper)}
.disclaimer{border:1.4px dashed var(--gray);padding:6px 10px;font-size:12.5px;color:#5f584f;margin:8px 0}


/* bookshelf */
.shelf{display:flex;align-items:flex-end;gap:5px;padding:12px 10px 0;border-bottom:8px solid #8c7e66;min-height:170px;margin:10px 0 4px;flex-wrap:wrap}
.spine{width:46px;height:150px;border:1.6px solid var(--ink);background:var(--kraft);padding:6px 3px;writing-mode:vertical-rl;font-family:var(--hand);font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:2px;position:relative;line-height:1;color:var(--ink);transition:transform .15s}
.spine:nth-child(2n){height:132px;background:#e9e1cf}.spine:nth-child(3n){height:158px;background:#c8bba2}
.spine:hover{transform:translateY(-6px)}
.spine.on{transform:translateY(-12px);background:var(--ink);color:var(--paper)}
.room{color:var(--ink);background-color:var(--paper);border:1.5px solid #8f8470;border-top:10px solid var(--cover,#8f8470);border-radius:6px;padding:26px 30px 30px;box-shadow:0 10px 22px rgba(56,52,47,.22);min-height:600px}
.room[hidden],.book[hidden],.pager[hidden]{display:none!important}
.room .case{padding:0 14px 2px;border-color:color-mix(in srgb,var(--cover) 75%,#3a3228);background:linear-gradient(color-mix(in srgb,var(--cover) 22%,#f4ecdc),color-mix(in srgb,var(--cover) 30%,#e6dcc6))}
.room .shelf{border-bottom-color:color-mix(in srgb,var(--cover) 70%,#3a3228)}
.room.paper-lined{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(56,52,47,.12) 31px 32px)}
.room.paper-grid{background-image:linear-gradient(rgba(56,52,47,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,52,47,.08) 1px,transparent 1px);background-size:26px 26px}
.room.paper-dot{background-image:radial-gradient(rgba(56,52,47,.2) 1.1px,transparent 1.5px);background-size:22px 22px}
.room .shelf{min-height:184px}
.live{font-family:var(--body);font-size:12px;color:#7d7a55;vertical-align:middle;margin-left:6px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.thought{font-family:var(--hand);font-size:19px;line-height:1.25;color:#4a443d;border-left:2.5px solid rgba(56,52,47,.45);padding-left:8px;margin-top:6px}
.rec-card{margin:8px 4px;padding:12px 14px 10px}
.match{display:flex;flex-direction:column;align-items:center;line-height:1;margin-left:8px}
.match b{font-family:var(--hand);font-size:30px;font-weight:400}
.match span{font-size:11px;color:#6a6358;margin-top:2px}
.meter{height:6px;border:1.2px solid var(--ink);border-radius:4px;margin:8px 0 6px;overflow:hidden;background:rgba(255,253,247,.6)}
.meter i{display:block;height:100%;background:var(--ink);border-radius:2px}
.why{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 6px}
.why li{font-size:12.5px;border:1px dashed var(--gray);border-radius:10px;padding:1px 8px;color:#4a443d}
.castlist{max-height:440px;overflow:auto;padding:2px 4px 4px 0;margin:4px 0 6px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 10px}
@media (max-width:640px){.room{padding:18px 14px 22px}}
.case{border:2px solid #8c7e66;border-top-width:10px;background:linear-gradient(#efe7d4,#e6dcc6);padding:0 8px 2px;border-radius:3px;margin:10px 0 6px}
.case .shelf{min-height:178px;margin:0;flex-wrap:nowrap;overflow:hidden}
.spine::before{content:"";position:absolute;left:3px;right:3px;top:16px;height:5px;border-top:1.3px solid currentColor;border-bottom:1.3px solid currentColor;opacity:.45}
.spine span{overflow:hidden;max-height:100%}
.spine.mine{height:160px;width:52px;box-shadow:0 0 0 2px var(--ink),3px 3px 0 rgba(56,52,47,.3)}
.spine.slot{background:transparent!important;border-style:dashed;color:#6a6358;height:140px}
.spine.slot::before{display:none}
.spine.new{animation:slidein .6s ease-out}
@keyframes slidein{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.coverbook{width:64px;height:88px;border:1.6px solid var(--ink);background:var(--kraft);font-family:var(--hand);font-size:17px;line-height:1.05;padding:6px;display:flex;align-items:flex-end;text-align:left;flex:none;position:relative}
.coverbook::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1.5px solid rgba(56,52,47,.5)}
.bk{display:flex;gap:12px;align-items:center;margin:6px 4px}
.bk .coverbook:nth-child(odd){}
.statusrow .tag{cursor:pointer}

.kv{font-size:14.5px}
.kv dt{font-family:var(--hand);font-size:19px;display:inline;margin-right:6px}
.kv dd{display:inline;margin:0}
.quiz-opt{display:block;width:100%;text-align:left;margin:7px 0;background:#fffdf7;border:1.5px solid var(--ink);padding:9px 12px;border-radius:3px 8px 4px 7px;font-size:15.5px;line-height:1.55;transition:transform .12s}
.quiz-opt:hover{transform:translateX(4px);background:var(--kraft)}
.progress{height:8px;border:1.4px solid var(--ink);margin:6px 0 14px;position:relative;background:#fffdf7}
.progress i{display:block;height:100%;background:var(--ink)}

/* cover overlay */
.intro{position:fixed;inset:0;z-index:60;background:#c9bb9f;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .19  0 0 0 0 .15  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.intro[hidden]{display:none}
.cover{background:var(--kraft);border:2px solid #6e6454;border-radius:6px 16px 16px 6px;max-width:470px;width:100%;padding:44px 34px 30px 52px;position:relative;box-shadow:0 12px 30px rgba(56,52,47,.4);transform:rotate(-1deg)}
.cover::before{content:"";position:absolute;left:18px;top:14px;bottom:14px;width:14px;background:radial-gradient(circle,#f3efe6 0 4px,#4a443d 4.5px 6px,transparent 6.5px) 0 0/14px 40px repeat-y}
.cover .label{background:var(--paper);border:1.5px solid var(--ink);padding:18px 16px 14px;text-align:center;transform:rotate(1.2deg);position:relative}
.cover h1{font-family:var(--type);font-size:30px;letter-spacing:.1em;line-height:1.15;font-weight:400;white-space:nowrap}
.cover p{margin:10px 0 0}
.cover .tagline{font-family:var(--hand);font-size:clamp(14px,4vw,23px);line-height:1.15;white-space:nowrap}
@media (max-width:520px){.cover{padding:30px 16px 24px 40px}.cover .label{padding:16px 10px 12px}.cover h1{font-size:26px}}

/* print/export & misc */
.copybox{width:100%;min-height:150px;font-family:var(--type);font-size:12.5px}
.avopt{border:1.6px solid transparent;background:none;padding:2px;border-radius:50%}
.avopt.on{border-color:var(--ink)}
.chiprow button{cursor:pointer}
.warn{font-size:13px;border-left:3px solid var(--gray);padding:2px 10px;color:#5a534a;margin:8px 0}

@media (max-width:860px){
  body{padding:10px 6px 90px}
  .book{flex-direction:column-reverse;padding:10px 8px;border-radius:8px}
  .tabs{flex-direction:row;overflow-x:auto;width:auto;padding:0 0 8px;gap:4px;scrollbar-width:thin}
  .tab{border:1.5px solid #6e6454;border-bottom:0;border-radius:9px 9px 0 0;margin:0;padding:6px 10px;font-size:18px;white-space:nowrap;width:auto;flex:none;box-shadow:none}
  .tab.on{margin:0}
  .tabs{order:-1}
  .book{flex-direction:column}
  .spread{grid-template-columns:1fr}
  .book>.spread>.rings{display:none}
  .page{display:none;min-height:560px;padding:24px 18px 30px;border-radius:4px!important;box-shadow:none!important}
  .page.on{display:block}
  .pager{display:flex;justify-content:space-between;align-items:center;position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:6px 14px;z-index:30;font-family:var(--hand);font-size:20px}
  .pager button{background:none;border:1.4px solid var(--paper);color:var(--paper);font-family:var(--hand);font-size:20px;padding:2px 12px;border-radius:4px}
  .ptitle{font-size:34px}
  .logo small{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

const SHEETS={cream:{name:'미색',c:'#F3EFE6'},white:{name:'백색',c:'#FBFAF6'},butter:{name:'버터',c:'#F6EFD2'},pink:{name:'벚꽃',c:'#F7E8E5'},sky:{name:'하늘',c:'#E7EEF2'},mint:{name:'민트',c:'#E6EFE6'}};

   {q:'어른들은 왜 숫자만 말해?',k:['어른','숫자','돈','바쁘'],a:'어른들은 새 친구 얘기를 하면 "나이가 몇이니, 형제는 몇이니" 하고 물어. 목소리가 어떤지는 안 물어보고. 조금 이상해.'},
   {q:'책임진다는 건 뭐야?',k:['책임','약속','돌','지키'],a:'길들인 것에는 영원히 책임이 있대. 그래서 나는 내 장미한테 돌아가야 해. 장미는 생각보다 약하고, 가시 네 개밖에 없거든.'},
   {q:'헤어지는 건 슬프지 않아?',k:['이별','헤어','슬프','작별'],a:'슬퍼. 그래도 밀밭을 보면 여우가 생각나. 헤어져도 남는 게 있다는 걸 알게 되면, 조금은 괜찮아져.'}
  ]},
 gildong:{id:'gildong',cat:'한국 고전',name:'홍길동',work:'홍길동전',author:'허균',era:'조선 시대 고전소설',trait:'재주가 뛰어나고 의리가 깊으며 불의를 보면 참지 못한다',conflict:'신분 차별과 가족 안에서의 소외',
  greet:'나는 홍길동이다. 이름 하나 제대로 불리지 못했던 사람이지. 무엇이 궁금하냐?',
  sc:[
   {q:'왜 집을 떠났어?',k:['떠','집','왜','가출'],a:'재주가 있어도 서자라는 이유로 아버지를 아버지라 부르지 못했다. 그 집에 남아서는 나도, 나를 아끼는 사람도 숨이 막힐 것 같았다.'},
   {q:'불공평한 일엔 어떻게 맞서?',k:['불공평','정의','불의','맞서','차별'],a:'혼자 화내는 것으로는 부족하다. 같은 억울함을 가진 이들과 뜻을 모으고, 무엇이 잘못인지 분명히 말해야 한다.'},
   {q:'자유란 뭘까?',k:['자유','구속','틀','규칙'],a:'자유는 규칙을 모두 없애는 게 아니라, 이름과 자리를 내가 정할 수 있는 것이라고 생각한다. 남이 붙여 준 이름에서 벗어나는 일이다.'},
   {q:'의적은 옳은 일일까?',k:['의적','도둑','옳','훔'],a:'쉽게 답할 수 없는 질문이다. 나는 탐관오리의 재물을 나눴지만, 법을 어긴 것도 사실이다. 그래서 늘 스스로에게 되묻는다.'},
   {q:'어디서 힘을 얻어?',k:['힘','용기','어떻게','버티'],a:'함께한 사람들에게서다. 혼자였다면 이미 포기했을 것이다. 나를 믿어 준 사람들 덕분에 나는 끝까지 갈 수 있었다.'},
   {q:'어떤 나라를 꿈꿔?',k:['나라','이상','꿈','율도'],a:'태어난 처지로 사람을 가르지 않는 곳이다. 각자 가진 재주를 펼칠 수 있고, 서로의 이름을 제대로 불러 주는 곳.'}
  ]},
 chunhyang:{id:'chunhyang',cat:'한국 고전',name:'춘향',work:'춘향전',author:'작자 미상',era:'조선 후기 판소리계 소설',trait:'다정하지만 자신의 신념 앞에서는 한 발도 물러서지 않는다',conflict:'권력의 압박과 사랑의 약속',
  greet:'어서 오세요. 저는 춘향이라 합니다. 편하게 물어보셔요.',
  sc:[
   {q:'왜 끝까지 거절했어요?',k:['거절','왜','수청','버텼'],a:'제 마음은 힘으로 가져갈 수 있는 물건이 아니니까요. 한번 한 약속을 저버리면, 저는 저 자신을 잃어버릴 것 같았습니다.'},
   {q:'존엄이란 뭘까요?',k:['존엄','자존','품위','나답'],a:'신분이 뭐든, 내 몸과 마음의 주인은 나라는 믿음이에요. 누가 저를 낮춰 불러도 제 값어치는 변하지 않아요.'},
   {q:'두렵지 않았어요?',k:['두렵','무섭','겁','두려'],a:'무서웠지요. 옥에 갇혀 밤새 울기도 했고요. 하지만 두려움과 포기는 다른 것이라고 스스로에게 말해 주었어요.'},
   {q:'사랑은 어떤 거라고 생각해요?',k:['사랑','연애','님','이도령'],a:'서로를 높여 주는 믿음이라고 생각해요. 좋을 때만 곁에 있는 게 아니라, 어려울 때 약속을 기억해 주는 것이요.'},
   {q:'지치면 어떻게 버텨요?',k:['지치','버티','힘들','포기'],a:'오늘 하루만 지키자, 하고 생각했어요. 먼 훗날이 아니라 오늘 밤 한 번의 선택에만 집중하면 조금 덜 무겁더라고요.'},
   {q:'신념을 지키는 게 어려울 땐?',k:['신념','어렵','선택','흔들'],a:'혼자라고 느껴질 때가 제일 흔들려요. 그럴수록 월매 어머니나 방자처럼 곁을 지켜 준 얼굴들을 떠올려요.'}
  ]},
 hamlet:{id:'hamlet',cat:'문학',name:'햄릿',work:'햄릿',author:'윌리엄 셰익스피어',era:'17세기 초 영국 비극',trait:'생각이 깊고 말이 날카로우며 확신 전에는 쉽게 움직이지 않는다',conflict:'복수와 망설임, 진실을 알고 싶은 마음',
  greet:'……왔는가. 나는 덴마크의 왕자 햄릿이다. 오늘 밤은 질문이 많아서 잠이 오지 않는군.',
  sc:[
   {q:'왜 그렇게 망설여요?',k:['망설','주저','왜','행동'],a:'한번 저지른 일은 되돌릴 수 없으니까. 내가 본 것이 진실인지 확인하기 전에 칼을 뽑는 건, 또 다른 비극을 만들 뿐이라 생각했다.'},
   {q:'진실은 어떻게 알아내요?',k:['진실','거짓','확인','알아'],a:'나는 극을 올려 사람들의 표정을 보았다. 말은 꾸밀 수 있어도 얼굴은 때로 먼저 대답한다. 증거는 차분히 모아야 한다.'},
   {q:'외로울 땐 뭘 해요?',k:['외로','고독','혼자','쓸쓸'],a:'나는 쓴다, 그리고 말한다. 독백이란 결국 나 자신에게 던지는 질문이다. 그러다 보면 내 마음이 어디에 있는지 조금씩 보인다.'},
   {q:'삶의 의미가 뭘까요?',k:['삶','의미','죽음','살아'],a:'답을 안다고 하면 거짓말이겠지. 다만 질문을 멈추지 않는 것, 그 자체가 살아 있다는 증거 아닐까 하고 생각한다.'},
   {q:'복수는 옳은 일일까요?',k:['복수','원수','분노','옳'],a:'분노는 나를 움직이게 하지만, 방향을 잃으면 주변 사람들까지 다치게 한다. 나는 그 무게를 끝내 다 짊어지지 못했다.'},
   {q:'친구에겐 뭘 바라요?',k:['친구','호레이쇼','우정','믿'],a:'호레이쇼 같은 친구다. 운이 좋을 때나 나쁠 때나 같은 얼굴을 하고 있는 사람. 그런 이가 한 명이라도 있다면 충분하다.'}
  ]}
};
/* 발표용: 싯다르타 (헤르만 헤세, 1922) — 원문 인용이 아닌 작품 해석 기반 대사 */
CHARS.siddhartha={id:'siddhartha',cat:'철학',pick:true,name:'싯다르타',work:'싯다르타',author:'헤르만 헤세',era:'20세기 초 독일 소설 · 구도와 깨달음',
 trait:'스스로 걸어 보지 않은 길은 믿지 않으며, 말하기보다 듣는 법을 강에게서 배웠다',conflict:'가르침과 체험 사이, 진짜 나를 찾는 여정',
 greet:'어서 오게, 벗이여. 나는 강가에서 뱃사공으로 사는 싯다르타라네. 오늘도 강물 소리를 들으며 누군가를 기다리고 있었지. 무엇이 그대의 마음을 흔드는가?',
 sc:[
  {q:'깨달음이란 뭐예요?',k:['깨달','득도','진리','해탈','깨우','지혜'],a:'지식은 말로 건넬 수 있지만, 지혜는 건넬 수가 없다네. 깨달음은 누군가에게 받아 오는 것이 아니라, 직접 살아 보고 넘어져 보면서 몸으로 알게 되는 것이지.'},
  {q:'왜 부처님의 제자가 되지 않았어요?',k:['부처','고타마','제자','스승','가르침','배우'],a:'고타마의 가르침은 더없이 훌륭했네. 하지만 가르침은 그분이 걸은 길의 지도일 뿐, 길 그 자체는 아니었지. 나는 내 발로 걸어야 했어. 그래서 가장 존경하는 스승 곁을 떠났다네.'},
  {q:'당신이 할 수 있는 건 뭐예요?',k:['할수','능력','잘하','재능','기술','장점','무엇을할'],a:'나는 생각할 줄 알고, 기다릴 줄 알고, 굶을 줄 안다네. 대단해 보이지 않겠지만, 이 세 가지가 있으면 서두르지 않고 무엇이든 해낼 수 있지.'},
  {q:'강에게서 무엇을 배웠어요?',k:['강물','강가','강에','강은','뱃사공','바수데바','흐르','흐름'],a:'강은 늘 흐르지만 언제나 그 자리에 있네. 강에게는 과거도 미래도 없고, 오직 지금만 있지. 바수데바는 내게 말하는 법이 아니라 듣는 법을 가르쳐 주었다네.'},
  {q:'진로가 고민돼요',k:['진로','미래','꿈','직업','앞으로','전공','취업','선택'],a:'나도 아버지의 집을 떠나 사문으로, 상인으로, 뱃사공으로 길을 여러 번 바꾸었네. 돌아보니 잘못 든 길은 없었어. 모든 길이 지금의 나에게로 흘러왔지. 서두르지 말고, 그대 안의 목소리가 들릴 때까지 기다려 보게.'},
  {q:'실패하면 어떡하죠?',k:['실패','망하','망쳤','후회','잘못','실수','떨어'],a:'나는 부와 쾌락 속에서 나를 잃었고, 강가에서 모든 걸 끝내려고까지 했네. 그런데 바로 그 바닥에서 마음속 깊은 소리를 다시 들었지. 넘어져 본 사람만 닿을 수 있는 깨달음도 있다네.'},
  {q:'사랑이 뭐예요?',k:['사랑','카말라','연애','좋아하','짝사랑','이별'],a:'카말라에게서 사랑의 기술을 배웠지만, 정작 사랑하는 법은 훗날 아들을 통해 배웠네. 사랑은 붙잡는 것이 아니라, 상대가 제 길을 가도록 놓아주는 것이더군.'},
  {q:'친구란 어떤 존재예요?',k:['친구','고빈다','우정','벗','관계'],a:'고빈다는 오랫동안 내 그림자처럼 함께 걸었고, 끝내 스스로의 길을 택했지. 친구란 같은 길을 걷는 사람이 아니라, 서로 다른 길을 가다가 다시 만났을 때 한눈에 알아보는 사람이라네.'},
  {q:'불안할 땐 어떻게 해요?',k:['불안','걱정','두려','무서','초조','긴장','스트레스'],a:'강가에 앉아 물소리를 들어 보게. 불안은 대개 아직 오지 않은 내일에서 오지. 그런데 강에는 내일이 없네. 숨 한 번, 물결 하나에만 머물러 보게.'},
  {q:'돈과 성공은 중요하지 않나요?',k:['돈','성공','부자','명예','상인','카마스와미','출세'],a:'카마스와미 곁에서 장사를 배워 부자가 되었지. 처음엔 놀이 같았는데, 어느새 그 놀이가 나를 삼키고 있었네. 돈이 나쁜 건 아니야. 다만 그것이 주인이 되면 마음이 잠들어 버린다네.'},
  {q:'아버지를 떠날 때 어땠어요?',k:['아버지','부모','엄마','가족','떠나','독립','반대'],a:'아버지는 허락하지 않으셨지. 나는 밤새 팔짱을 끼고 그 자리에 서 있었네. 새벽이 되자 아버지는 결국 나를 보내 주셨어. 떠나는 일도, 보내 주는 일도 모두 사랑이었다는 걸 나중에야 알았지.'},
  {q:'아들 이야기를 해 주세요',k:['아들','자식','자녀','놓아','보내주'],a:'아들이 나를 떠났을 때 가슴이 찢어지는 듯했네. 그때 알았어. 내가 아버지를 떠났듯, 아들도 자기 길을 가야 한다는 걸. 그 상처를 강물에 비추어 보니 조금씩 아물더군.'},
  {q:'시간이란 뭘까요?',k:['시간','과거','현재','영원','순간'],a:'강은 근원에서도, 바다에서도, 폭포에서도 동시에 존재한다네. 시간이란 어쩌면 우리 마음이 그어 놓은 경계일지도 모르지. 지금 이 순간 안에 모든 것이 다 들어 있다네.'},
  {q:'외로울 땐 어떻게 해요?',k:['외로','고독','혼자','쓸쓸'],a:'숲에서 사문으로 지낼 때 나는 늘 혼자였지. 외로움은 피해야 할 적이 아니라, 내 안의 소리를 들을 수 있는 고요한 방이라네.'},
  {q:'행복은 어디에 있어요?',k:['행복','기쁨','즐거','만족','평화'],a:'나는 행복을 찾아 아주 멀리 떠났는데, 결국 강가의 작은 오두막에서 찾았네. 애써 찾는 동안에는 보이지 않더군. 멈추고 귀 기울일 때 비로소 보였다네.'},
  {q:'고통은 왜 있는 거예요?',k:['고통','아프','괴로','힘들','슬프','우울'],a:'고통도 강물처럼 흘러간다네. 강가에서 들은 수많은 목소리 중에는 웃음도 울음도 있었지. 그 모든 소리가 합쳐지자 하나의 노래가 되었어. 그대의 아픔도 언젠가 그 노래의 한 소절이 될 걸세.'},
  {q:'싯다르타는 어떤 사람이에요?',k:['누구','소개','어떤사람','자기소개'],a:'브라만의 아들로 태어나 모두의 기대를 받았지만, 진리를 찾아 집을 떠난 사람이라네. 사문으로 굶어도 보고, 상인으로 부자가 되어도 보고, 지금은 강가에서 사람들을 건네주며 살고 있지.'}

const API='/api/notebooks';
const SHARED={online:false,loaded:false,list:[]};
function rnd(n){const a=new Uint8Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
function shareCred(){if(!S.share||!S.share.id){S.share={id:rnd(8),token:rnd(16),on:false};save()}return S.share}
function sinceText(t){if(!t)return '';const m=Math.round((Date.now()-t)/60000);return m<1?'방금 꽂혔어요':m<60?m+'분 전에 꽂혔어요':Math.round(m/60)+'시간 전에 꽂혔어요'}
function toFriend(n){
  return {id:'s'+n.id,sid:n.id,shared:true,nick:n.nick,bio:n.bio,avatar:(n.avatar|0)%AV.length,persona:PERSONAS[n.persona]?n.persona:null,coverTitle:n.coverTitle,
   quotes:(n.quotes||[]).map((q,i)=>({...q,id:'s'+n.id+'q'+i,tags:q.tags||[],font:FONTS[q.font]?q.font:''})),books:n.books||[],
   convs:(n.convs||[]).filter(c=>CHARS[c.charId]),comments:n.comments||[],createdAt:n.createdAt};
}
function findFriend(id){return FRIENDS.find(x=>x.id===id)||SHARED.list.find(x=>x.id===id)||null}
async function api(path,opt){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(API+path,{cache:'no-store',...opt,signal:ctl.signal,headers:{'Content-Type':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
  finally{clearTimeout(t)}
}
async function shareRefresh(){
  try{const j=await api('');const mine=S.share&&S.share.id;SHARED.list=(j.notebooks||[]).filter(n=>n.id!==mine).map(toFriend);SHARED.online=true}
  catch(e){SHARED.online=false}
  SHARED.loaded=true;
  const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!ui.inFriend&&(ui.view==='home'||ui.view==='friends')&&$('modal').hidden&&!typing)render();
}
function myNotebook(){
  const pr=S.profile;
  return {nick:pr.nick,bio:pr.bio,coverTitle:pr.coverTitle,avatar:pr.avatar,persona:pr.persona,
   quotes:S.quotes.filter(q=>q.vis!=='me').map(q=>({text:q.text,book:q.book,author:q.author,thought:q.thought,tags:q.tags,font:q.font})),
   books:[],
   convs:S.conversations.filter(c=>c.vis==='friends').map(c=>({charId:c.charId,note:c.note,lines:c.msgs.slice(-6).map(m=>({who:m.who,text:m.text}))}))};
}
async function sharePush(quiet){
  const c=shareCred();
  try{await api('/'+c.id,{method:'PUT',body:JSON.stringify({token:c.token,notebook:myNotebook()})});
    if(!c.on){c.on=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    if(!quiet)toast('우리 책장에 내 수첩을 꽂았어요');shareRefresh();return true}
  catch(e){if(!quiet)toast(e.message==='shelf_full'?'책장이 가득 찼어요':'서버에 연결하지 못했어요');return false}
}
let pushT=null;
function queuePush(){if(!S.share||!S.share.on||!SHARED.online)return;clearTimeout(pushT);pushT=setTimeout(()=>sharePush(true),1200)}
async function shareOff(){
  const c=S.share;if(!c||!c.on)return;
  try{await api('/'+c.id,{method:'DELETE',body:JSON.stringify({token:c.token})})}catch(e){}
  c.on=false;save();shareRefresh();toast('우리 책장에서 내 수첩을 뺐어요');render();
}

/* 친구 찾기 — 나와 취향이 비슷한 친구 추천 */
function myTaste(){
  const p=persona(),tags={},books=new Set(),authors=new Set(),chars=new Set(S.conversations.map(c=>c.charId));
  S.quotes.forEach(q=>{if(q.book)books.add(q.book.trim());if(q.author)authors.add(q.author.trim());(q.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1)});
  return {p,tags,books,authors,chars,empty:!p&&!S.quotes.length&&!S.conversations.length};
}
function tasteMatch(f,me){
  me=me||myTaste();let score=0;const why=[];
  const fp=f.persona&&PERSONAS[f.persona];
  if(me.p&&fp){
    if(me.p.key===fp.key){score+=35;why.push(`같은 페르소나 · ${fp.alias}`)}
    else{const kw=fp.kw.filter(k=>me.p.kw.includes(k));if(kw.length){score+=8*kw.length;why.push(`비슷한 성향 · ${kw.join(', ')}`)}}
  }
  const fb=new Set([...(f.quotes||[]).map(q=>(q.book||'').trim()),...(f.books||[]).map(b=>(b.title||'').trim())].filter(Boolean));
  const sameBooks=[...me.books].filter(b=>fb.has(b));
  if(sameBooks.length){score+=18*Math.min(sameBooks.length,3);why.push(`같은 책 · ${sameBooks.slice(0,2).map(b=>'『'+b+'』').join(' ')}${sameBooks.length>2?' 외 '+(sameBooks.length-2)+'권':''}`)}
  const fa=new Set((f.quotes||[]).map(q=>(q.author||'').trim()).filter(Boolean));
  const sameAuthors=[...me.authors].filter(a=>fa.has(a)&&!sameBooks.length);
  if(sameAuthors.length){score+=8*Math.min(sameAuthors.length,2);why.push(`좋아하는 작가 · ${sameAuthors[0]}`)}
  const ft={};(f.quotes||[]).forEach(q=>(q.tags||[]).forEach(t=>ft[t]=(ft[t]||0)+1));
  const sameTags=Object.keys(me.tags).filter(t=>ft[t]).sort((a,b)=>(me.tags[b]+ft[b])-(me.tags[a]+ft[a]));
  if(sameTags.length){score+=6*Math.min(sameTags.length,3);why.push(`함께 모으는 마음 · ${sameTags.slice(0,3).map(t=>'#'+t).join(' ')}`)}
  const sameChars=(f.convs||[]).map(c=>c.charId).filter((c,i,a)=>me.chars.has(c)&&a.indexOf(c)===i);
  if(sameChars.length){score+=7*sameChars.length;why.push(`같은 인물과 대화 · ${sameChars.map(c=>CHARS[c]?CHARS[c].name:c).join(', ')}`)}
  return {score:Math.min(99,score),why};
}

   <button class="btn" style="margin-top:8px" data-act="nav" data-v="home">내 책장 보기</button>`;
  return [L,R];
};

  }

  $('pages').innerHTML=`<section class="page L ${ui.page===0?'on':''}" aria-label="앞 페이지">${L}</section><section class="page R ${ui.page===1?'on':''}" aria-label="뒷 페이지">${R}</section>`;

function exportText(){
  const p=persona();
  let t=`[${S.profile.coverTitle}] ${S.profile.nick} — ${S.profile.bio}\n`;
  if(p)t+=`페르소나: ${p.alias} (${p.name})\n`;
  t+=`\n# 문장 ${S.quotes.length}\n`+S.quotes.map(q=>`- ${q.text} — 『${q.book}』${q.author?' '+q.author:''}${q.thought?'\n  생각: '+q.thought:''}`).join('\n');
  t+=`\n\n# 대화 ${S.conversations.length}\n`+S.conversations.map(c=>`- ${CHARS[c.charId].name} (${c.date})${c.note?' “'+c.note+'”':''}`).join('\n');

/* ================= 대화 로직 ================= */
function searchChars(q,cat){
  const n=x=>String(x||'').replace(/\s/g,'').toLowerCase(),t=n(q);
  return Object.values(CHARS).filter(ch=>(!cat||cat==='전체'||ch.cat===cat)&&(!t||[ch.name,ch.work,ch.author,ch.cat,ch.era,ch.trait,ch.conflict,...ch.sc.map(s=>s.q)].some(x=>n(x).includes(t))||ch.sc.some(s=>s.k.some(k=>t.includes(n(k))||n(k).includes(t)))))
   .sort((a,b)=>(b.pick?2:0)+(b.lite?0:1)-((a.pick?2:0)+(a.lite?0:1)));
}
function startChat(id){ui.chat={charId:id,id:null,msgs:[{who:'ch',text:CHARS[id].greet}],saved:[]}}
function reply(ch,text){
  const t=text.replace(/\s/g,'');let best=null,sc=0;
  ch.sc.forEach(s=>{let n=0;s.k.forEach(k=>{if(t.includes(k))n++});if(n>sc){sc=n;best=s}});
  if(best)return best.a;
  const fb=FALLBACK[ch.id];return fb[(ui.chat.msgs.length>>1)%fb.length];
}
function persistChat(){
  const c=ui.chat;if(!c)return;
  if(c.id){const r=S.conversations.find(x=>x.id===c.id);if(r){r.msgs=c.msgs.slice();r.saved=c.saved.slice();return}}
  c.id=uid();S.conversations.push({id:c.id,charId:c.charId,date:today(),msgs:c.msgs.slice(),saved:c.saved.slice(),note:'',vis:'me'});
}

 'talk-q'(e){const ch=CHARS[ui.chat.charId],s=ch.sc[+e.i];ui.chat.msgs.push({who:'me',text:s.q},{who:'ch',text:s.a});if(ui.chat.id)persistChat(),save();render()},
 'talk-star'(e){const c=ui.chat,i=+e.i;const k=c.saved.indexOf(i);if(k>=0)c.saved.splice(k,1);else c.saved.push(i);persistChat();save();render();toast(k>=0?'저장을 해제했어요':'답변을 수첩에 기록했어요')},
 'talk-save'(){const had=!!ui.chat.id;persistChat();save();render();toast(had?'대화 기록을 갱신했어요':'대화를 수첩에 저장했어요')},
 'talk-note'(){const r=S.conversations.find(x=>x.id===ui.chat.id);openModal(`<h3>한 줄 감상</h3><form data-form="talk-note"><label for="tn">이 대화에서 남기고 싶은 한 줄</label><input type="text" id="tn" name="t" maxlength="60" value="${esc(r.note||'')}"><div class="row" style="margin-top:12px"><button class="btn solid" type="submit">저장</button><button class="btn" type="button" data-act="close">취소</button></div></form>`)},
 'talk-vis'(){const r=S.conversations.find(x=>x.id===ui.chat.id);r.vis=r.vis==='friends'?'me':'friends';save();render();toast(r.vis==='friends'?'친구에게 보이도록 바꿨어요':'나만 보도록 바꿨어요')},
 'talk-del'(){const id=ui.chat.id;confirmBox('이 대화 기록을 지울까요?',()=>{S.conversations=S.conversations.filter(x=>x.id!==id);ui.chat=null;ui.page=0;save();render();toast('대화 기록을 지웠어요')},'지우기')},
 'friend-open'(e){ui.fSel=e.id;ui.inFriend=e.id;ui.fTab='intro';ui.page=0;render(true);window.scrollTo({top:0})},
 'friend-exit'(){ui.inFriend=null;ui.page=0;render(true)},
 ftab(e){ui.fTab=e.v;ui.page=0;render(true)},
 'friend-go'(e){closeModal();ui.fSel=e.id;ui.inFriend=e.id;ui.fTab=e.v||'intro';ui.page=0;render(true);window.scrollTo({top:0})},
 'friend-menu'(e){friendMenu(e.id)},
 'friend-move'(e){const a=S.friends.added,i=a.indexOf(e.id),j=i+(+e.v);if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];ui.justAdded=null;save();render();friendMenu(e.id)},
 'rec-skip'(e){const s=S.friends.skipped||(S.friends.skipped=[]);if(!s.includes(e.id))s.push(e.id);save();render();toast('이 추천은 넘길게요')},
 'rec-unskip'(){S.friends.skipped=[];save();render()},
 'friend-add'(e){if(!S.friends.added.includes(e.id))S.friends.added.push(e.id);ui.justAdded=e.id;save();render();toast('내 책장에 수첩을 꽂았어요')},
 'friend-del'(e){const f=findFriend(e.id);if(!f)return;confirmBox(`${f.nick}의 수첩을 내 책장에서 뺄까요? 남긴 댓글은 그대로예요.`,()=>{S.friends.added=S.friends.added.filter(x=>x!==e.id);save();render();toast('책장에서 뺐어요')},'빼기')},
 'friend-take'(e){const f=findFriend(e.f),q=f.quotes[+e.i];if(S.quotes.some(x=>x.from===f.nick&&x.text===q.text))return;
   S.quotes.push({id:uid(),text:q.text,book:q.book,author:q.author,page:'',date:today(),thought:'',tags:q.tags.slice(),vis:'me',from:f.nick,kind:'summary'});save();render();toast('내 수첩에 담았어요')},
 'comment-del'(e){confirmBox('이 댓글을 지울까요?',()=>{S.comments=S.comments.filter(x=>x.id!==e.id);save();render();toast('댓글을 지웠어요')},'지우기')},
 deco(e){if(!['cover','sheet','paper','bind','font'].includes(e.k))return;S.settings[e.k]=e.v;save();render()},
 'deco-theme'(e){const t=THEMES.find(x=>x.id===e.v);if(!t)return;Object.assign(S.settings,t.set);save();render();toast(`‘${t.name}’ 조합을 입혔어요`)},
 'deco-reset'(){Object.assign(S.settings,{cover:'kraft',sheet:'cream',paper:'plain',bind:'ring',font:'default'});save();render();toast('기본 꾸미기로 되돌렸어요')},
 paper(e){S.settings.paper=e.v;save();render()},
 cover(e){S.settings.cover=e.v;save();render()},
 font(e){S.settings.font=e.v;save();render()},
 export(){openModal(`<h3>내 수첩 텍스트</h3><textarea class="copybox" readonly>${esc(exportText())}</textarea><div class="row" style="margin-top:10px"><button class="btn solid" data-act="copy-export">복사</button><button class="btn" data-act="close">닫기</button></div>`)},
 'copy-export'(){try{navigator.clipboard.writeText(exportText()).then(()=>toast('복사했어요'),()=>toast('복사에 실패했어요'))}catch(x){toast('복사할 수 없는 환경이에요')}},
 reset(){confirmBox('내가 적은 문장·책·대화·댓글이 모두 사라지고 처음 데모 데이터로 돌아가요.\n정말 초기화할까요?',()=>{if(S.share&&S.share.on)api('/'+S.share.id,{method:'DELETE',body:JSON.stringify({token:S.share.token})}).catch(()=>{});S=seed();S.meta.seen=true;ui.chat=null;ui.qSel=null;ui.bSel=null;ui.fSel=null;ui.inFriend=null;ui.fTab='intro';ui.pending=null;ui.test=null;save();go('home');toast('데모 데이터로 초기화했어요')},'초기화')}
};
document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeModal();return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  ev.preventDefault();
  fn({v:el.dataset.v,id:el.dataset.id,i:el.dataset.i,f:el.dataset.f,k:el.dataset.k});
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('modal').hidden){closeModal();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button][data-act]')){ev.preventDefault();ev.target.click()}
});
document.addEventListener('change',ev=>{
  if(ev.target.matches('#modal input[type=checkbox],#modal input[name=font]'))syncTgl();
  if(ev.target.name==='av'){document.querySelectorAll('.avopt').forEach(l=>l.classList.toggle('on',l.contains(ev.target)&&ev.target.checked))}
});
$('modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal')closeModal()});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  const d=new FormData(f),k=f.dataset.form;
  if(k==='quote'){
    const text=(d.get('text')||'').trim(),book=(d.get('book')||'').trim();
    if(!text||!book){toast('문장과 책 제목은 꼭 필요해요');return}
    const obj={text,book,author:(d.get('author')||'').trim(),page:(d.get('page')||'').trim(),date:d.get('date')||today(),thought:(d.get('thought')||'').trim(),vis:d.get('vis')==='friends'?'friends':'me',tags:d.getAll('tag'),font:FONTS[d.get('font')]?d.get('font'):''};
    const id=f.dataset.id;
    if(id){const q=S.quotes.find(x=>x.id===id);const kind=q.kind;Object.assign(q,obj);q.kind=kind;ui.qSel=id}
    else{obj.id=uid();S.quotes.push(obj);ui.qSel=obj.id;ui.qTag=null}
    save();closeModal();ui.page=ui.view==='quotes'?ui.page:ui.page;render();toast(id?'문장을 고쳤어요':'문장을 수첩에 붙였어요');
  }else if(k==='talk-search'){
    ui.talkQ=(d.get('q')||'').trim();render();
    const i=document.querySelector('form[data-form="talk-search"] input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  }else if(k==='talk-free'){
    const t=(d.get('t')||'').trim();if(!t)return;
    const ch=CHARS[ui.chat.charId];ui.chat.msgs.push({who:'me',text:t},{who:'ch',text:reply(ch,t)});
    if(ui.chat.id){persistChat();save()}render();
  }else if(k==='talk-note'){
    const r=S.conversations.find(x=>x.id===ui.chat.id);r.note=(d.get('t')||'').trim();save();closeModal();render();toast('한 줄 감상을 남겼어요');
  }else if(k==='onboard'){
    const nick=(d.get('nick')||'').trim();if(!nick){toast('닉네임을 적어 주세요');return}
    S.profile.nick=nick;S.profile.bio=(d.get('bio')||'').trim();S.profile.coverTitle=(d.get('cover')||'').trim()||'나의 문학 수첩';S.profile.avatar=+(d.get('av')||0);
    S.meta.made=true;save();closeModal();
    if(d.get('share'))sharePush();else toast('나만의 수첩이 생겼어요');
    go('mine');
  }else if(k==='comment'){
    const t=(d.get('t')||'').trim();if(!t){toast('댓글 내용을 적어 주세요');return}
    const sf=findFriend(f.dataset.f);
    if(sf&&sf.shared){api('/'+sf.sid+'/comments',{method:'POST',body:JSON.stringify({author:S.profile.nick,text:t})}).then(j=>{sf.comments=j.comments;render();toast('방명록에 남겼어요')}).catch(()=>toast('서버에 연결하지 못했어요'));return}
    S.comments.push({id:uid(),fid:f.dataset.f,author:S.profile.nick,text:t,date:today(),mine:true});save();render();toast('댓글을 붙였어요');
  }else if(k==='profile'){
    const nick=(d.get('nick')||'').trim();if(!nick){toast('닉네임을 적어 주세요');return}
    S.profile.nick=nick;S.profile.bio=(d.get('bio')||'').trim();S.profile.coverTitle=(d.get('cover')||'').trim()||'나의 문학 수첩';S.profile.avatar=+(d.get('av')||0);
    save();render();toast('수첩 표지를 저장했어요');
  }
});

/* ================= 시작 ================= */
(function init(){
  const h=(location.hash||'').replace('#','');
  if(VIEWS[h])ui.view=h;
  if(!S.meta.seen)$('intro').hidden=false;
  window.addEventListener('hashchange',()=>{const v=(location.hash||'').replace('#','');if(VIEWS[v]&&v!==ui.view){ui.view=v;ui.page=0;render(true)}});
  render();
})();
</script>
</body>
</html>
