<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEXT HIP UNIVERSE · 문학 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'OksuniSNostalgicHandwriting';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-oksooni-rg/griun-oksooni-rg/Griun_Oksooni-Rg.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'NostalgicOnHandwriting';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-onhandwriting-rg/griun-onhandwriting-rg/Griun_OnHandwriting-Rg.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'HandwritingAsOne';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/naverfont_01@1.0/Become_one.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'KotraHandwritingFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/KOTRA_SONGEULSSI.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
:root{
  --paper:#F3EFE6; --kraft:#D8CBB5; --ink:#38342F; --gray:#8A8379; --olive:#7d7a55; --plum:#8a6a78;
  --hand:'Nanum Pen Script','Gaegu','Segoe Print','Apple SD Gothic Neo',cursive;
  --body:'Nanum Myeongjo','Noto Serif KR','Batang','AppleMyungjo',serif;
  --type:'Special Elite','Courier New',monospace;
  --cover:#D8CBB5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); color:var(--ink); font-size:16px; line-height:1.7;
  background-color:#c9bb9f;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .19  0 0 0 0 .15  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  min-height:100vh; padding:18px 12px 40px;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.hand{font-family:var(--hand);font-weight:400;letter-spacing:.01em}
.type{font-family:var(--type)}
.sr{position:absolute;left:-9999px}

/* binder */
.wrap{max-width:1220px;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--type);font-size:20px;letter-spacing:.14em;transform:rotate(-1deg);display:inline-block;border:0;background:none;padding:0;text-align:left;transition:opacity .15s}
.logo:hover{opacity:.72}
.logo small{font-family:var(--hand);font-size:20px;letter-spacing:0;margin-left:10px;color:#4a443d}
.notice{font-size:12.5px;color:#4a443d;font-family:var(--body)}
.book{display:flex;background:var(--cover);border-radius:8px 14px 14px 8px;padding:14px 0 14px 14px;position:relative;
  box-shadow:0 2px 0 #b3a68d,0 10px 22px rgba(56,52,47,.28);border:1.5px solid #8f8470}
.book.c-ink{--cover:#4a453f;color:#F3EFE6}
.book.c-ink .tab{color:var(--ink)}
.book.c-paper{--cover:#e7e0d0}
.spread{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative;min-width:0;transition:opacity .25s,transform .25s}
.spread.turn{animation:turn .28s ease}
@keyframes turn{from{opacity:.2;transform:translateX(10px)}to{opacity:1;transform:none}}
.page{position:relative;min-height:690px;padding:30px 34px 36px;background:var(--paper);overflow:hidden;min-width:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>")}
.page.L{border-radius:6px 0 0 6px;box-shadow:inset -22px 0 24px -22px rgba(56,52,47,.35)}
.page.R{border-radius:0 6px 6px 0;box-shadow:inset 22px 0 24px -22px rgba(56,52,47,.35)}
.paper-lined .page{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(56,52,47,.14) 31px 32px),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");background-position:0 22px,0 0}
.paper-grid .page{background-image:linear-gradient(rgba(56,52,47,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(56,52,47,.1) 1px,transparent 1px),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");background-size:26px 26px,26px 26px,auto}
.rings{position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#f3efe6 0 5px,#4a443d 5.5px 7px,#bdb29c 7.5px 9px,transparent 9.5px) 0 0/30px 52px repeat-y}
.rings::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(56,52,47,.25);transform:translateX(-50%)}
.tabs{display:flex;flex-direction:column;gap:6px;padding-top:34px;width:66px;flex:none}
.tab{border:1.5px solid #6e6454;border-left:0;background:#e9e2d2;padding:10px 4px 10px 6px;border-radius:0 9px 9px 0;font-family:var(--hand);font-size:18px;line-height:1.1;text-align:center;word-break:keep-all;
  box-shadow:1px 1px 0 rgba(56,52,47,.25);transition:transform .15s,margin .15s;margin-left:-2px;color:var(--ink);width:100%}
.tab:nth-child(2n){background:#dfd5bf}.tab:nth-child(3n){background:#ece6d8}
.tab:hover{transform:translateX(3px)}
.tab.on{background:var(--paper);transform:translateX(0);margin-left:-4px;font-weight:700;border-color:var(--ink)}
.pager{display:none}

/* typography bits */
h1,h2,h3{font-weight:400;margin:0}
.ptitle{font-family:var(--hand);font-size:40px;line-height:1.05;display:inline-block;transform:rotate(-1.2deg);margin:0 0 4px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='8' viewBox='0 0 200 8'><path d='M1 5 C 30 1, 60 7, 95 4 S 160 2, 199 5' fill='none' stroke='%2338342F' stroke-width='1.8' stroke-linecap='round'/></svg>") left bottom/100% 8px no-repeat;padding-bottom:7px}
.sub{font-family:var(--hand);font-size:22px;color:#5d564d;margin:4px 0 12px}
.h3{font-family:var(--hand);font-size:27px;margin:16px 0 6px;display:flex;align-items:center;gap:8px;line-height:1.1}
.h3 .more{font-family:var(--body);font-size:12px;margin-left:auto;border:0;background:none;text-decoration:underline;color:var(--gray);padding:0}
.small{font-size:13px;color:var(--gray)}
.pen{color:#4b453e}
.sep{border:0;border-top:1.5px dashed #a89e8b;margin:14px 0}

/* paper bits */
.note{background:#fbf8f0;border:1px solid #cbbfa8;padding:12px 14px;margin:10px 4px;position:relative;box-shadow:1px 2px 0 rgba(56,52,47,.18),0 6px 8px -6px rgba(56,52,47,.35);transform:rotate(var(--r,0deg))}
.note.kraft{background:var(--kraft);border-color:#bba98a}
.note.card{background:#fffdf7;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(56,52,47,.1) 27px 28px);background-position:0 36px;border-top:3px double #c77;border-top-color:#a8685f}
.note.torn{clip-path:polygon(0 3%,4% 0,9% 2%,15% 0,22% 3%,30% 0,38% 2%,47% 0,55% 3%,64% 0,72% 2%,81% 0,90% 3%,100% 0,100% 100%,0 100%)}
.note.click{cursor:pointer;transition:transform .15s}
.note.click:hover{transform:rotate(0deg) translateY(-2px)}
.note.sel{outline:2px solid var(--ink);outline-offset:2px}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:20px;background:rgba(190,176,148,.72);border:1px solid rgba(120,106,80,.35);transform:translateX(-50%) rotate(-3deg);
  clip-path:polygon(0 0,100% 6%,97% 50%,100% 94%,0 100%,3% 50%)}
.tape.l{left:24px;transform:rotate(-8deg)}
.qt{font-family:var(--body);font-size:17px;line-height:1.75}
.cite{font-size:13px;color:#5f584f;margin-top:6px}
.tag{display:inline-block;font-family:var(--hand);font-size:18px;border:1.4px solid var(--ink);border-radius:12px 14px 11px 15px;padding:0 9px;margin:0 5px 4px 0;line-height:1.35;background:transparent;color:var(--ink)}
button.tag.on{background:var(--ink);color:var(--paper)}
.badge{display:inline-block;font-size:11px;border:1px dashed var(--gray);padding:0 6px;color:#6a6358;margin-left:4px;vertical-align:middle;border-radius:3px;font-family:var(--body)}
.btn{font-family:var(--hand);font-size:21px;line-height:1.1;background:#efe7d4;border:1.6px solid var(--ink);border-radius:5px 9px 6px 10px/9px 5px 10px 6px;padding:5px 13px 4px;box-shadow:2px 2px 0 rgba(56,52,47,.55);transition:transform .1s,box-shadow .1s;margin:2px 4px 4px 0;color:var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(56,52,47,.55)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.sm{font-size:18px;padding:2px 9px 1px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--gray);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:2px dashed #a89e8b;padding:18px;text-align:center;color:#6a6358;margin:10px 4px;border-radius:4px}
.empty .hand{font-size:24px;display:block;margin-bottom:6px}
.avatar{width:74px;height:74px;border:2px solid var(--ink);border-radius:50% 46% 52% 48%;background:#efe7d4;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:2px 2px 0 rgba(56,52,47,.4)}
.avatar svg{width:80%;height:80%}
.avatar.sm{width:44px;height:44px}
.me-head{display:flex;gap:16px;align-items:center}
.nick{font-family:var(--hand);font-size:38px;line-height:1}
.bio{font-family:var(--hand);font-size:22px;color:#5a534a;line-height:1.2;margin-top:4px}
.stk{position:absolute;pointer-events:none;z-index:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.persona-stamp{border:2px solid var(--ink);padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;transform:rotate(-1deg);background:#efe7d4;margin:8px 4px;border-radius:3px}
.persona-stamp b{font-family:var(--hand);font-size:26px;font-weight:400}

/* forms / modal */
label{display:block;font-family:var(--hand);font-size:21px;margin:10px 0 2px}
label .opt{font-family:var(--body);font-size:12px;color:var(--gray);margin-left:6px}
label .req{color:#8a4d44;margin-left:3px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:15.5px;background:rgba(255,253,247,.85);border:1.5px solid var(--ink);border-radius:3px 6px 3px 5px;padding:7px 10px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(40,36,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.overlay[hidden]{display:none}
.sheet{background:var(--paper);border:2px solid var(--ink);max-width:560px;width:100%;padding:22px 24px 20px;box-shadow:6px 6px 0 rgba(0,0,0,.35);position:relative;transform:rotate(-.4deg)}
.sheet h3{font-family:var(--hand);font-size:34px;line-height:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;font-family:var(--hand);font-size:22px;border-radius:4px 10px 5px 9px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast::before{content:"✓ ";}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0;max-height:370px;overflow:auto;padding:4px 4px 8px}
.msg{max-width:88%;padding:8px 12px;border:1.4px solid var(--ink);background:#fffdf7;position:relative;font-size:15.5px;line-height:1.65}
.msg.me{align-self:flex-end;background:var(--kraft);border-radius:10px 3px 10px 10px}
.msg.ch{align-self:flex-start;border-radius:3px 10px 10px 10px}
.msg .who{font-family:var(--hand);font-size:17px;color:#6a6358;display:block;line-height:1}
.star{position:absolute;right:-8px;top:-10px;background:var(--paper);border:1.4px solid var(--ink);border-radius:50%;width:26px;height:26px;line-height:20px;padding:0;font-size:15px}
.star.on{background:var(--ink);color:var(--paper)}
.disclaimer{border:1.4px dashed var(--gray);padding:6px 10px;font-size:12.5px;color:#5f584f;margin:8px 0}

/* map */
.mapbox{border:1.5px solid var(--ink);background:rgba(255,253,247,.5);margin:6px 0;border-radius:3px}
svg.map text{font-family:var(--hand);fill:var(--ink)}
svg.map .node{cursor:pointer}
svg.map .node:hover .shape,svg.map .node.sel .shape{stroke-width:3.2}
.legend span{margin-right:12px;font-size:13px;color:#5f584f;white-space:nowrap}

/* bookshelf */
.shelf{display:flex;align-items:flex-end;gap:5px;padding:12px 10px 0;border-bottom:8px solid #8c7e66;min-height:170px;margin:10px 0 4px;flex-wrap:wrap}
.spine{width:46px;height:150px;border:1.6px solid var(--ink);background:var(--kraft);padding:6px 3px;writing-mode:vertical-rl;font-family:var(--hand);font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:2px;position:relative;line-height:1;color:var(--ink);transition:transform .15s}
.spine:nth-child(2n){height:132px;background:#e9e1cf}.spine:nth-child(3n){height:158px;background:#c8bba2}
.spine:hover{transform:translateY(-6px)}
.spine.on{transform:translateY(-12px);background:var(--ink);color:var(--paper)}
.coverbook{width:64px;height:88px;border:1.6px solid var(--ink);background:var(--kraft);font-family:var(--hand);font-size:17px;line-height:1.05;padding:6px;display:flex;align-items:flex-end;text-align:left;flex:none;position:relative}
.coverbook::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1.5px solid rgba(56,52,47,.5)}
.bk{display:flex;gap:12px;align-items:center;margin:6px 4px}
.bk .coverbook:nth-child(odd){}
.statusrow .tag{cursor:pointer}

.kv{font-size:14.5px}
.kv dt{font-family:var(--hand);font-size:19px;display:inline;margin-right:6px}
.kv dd{display:inline;margin:0}
.quiz-opt{display:block;width:100%;text-align:left;margin:7px 0;background:#fffdf7;border:1.5px solid var(--ink);padding:9px 12px;border-radius:3px 8px 4px 7px;font-size:15.5px;line-height:1.55;transition:transform .12s}
.quiz-opt:hover{transform:translateX(4px);background:var(--kraft)}
.progress{height:8px;border:1.4px solid var(--ink);margin:6px 0 14px;position:relative;background:#fffdf7}
.progress i{display:block;height:100%;background:var(--ink)}

/* cover overlay */
.intro{position:fixed;inset:0;z-index:60;background:#c9bb9f;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .19  0 0 0 0 .15  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.intro[hidden]{display:none}
.cover{background:var(--kraft);border:2px solid #6e6454;border-radius:6px 16px 16px 6px;max-width:470px;width:100%;padding:44px 34px 30px 52px;position:relative;box-shadow:0 12px 30px rgba(56,52,47,.4);transform:rotate(-1deg)}
.cover::before{content:"";position:absolute;left:18px;top:14px;bottom:14px;width:14px;background:radial-gradient(circle,#f3efe6 0 4px,#4a443d 4.5px 6px,transparent 6.5px) 0 0/14px 40px repeat-y}
.cover .label{background:var(--paper);border:1.5px solid var(--ink);padding:18px 16px 14px;text-align:center;transform:rotate(1.2deg);position:relative}
.cover h1{font-family:var(--type);font-size:30px;letter-spacing:.1em;line-height:1.15;font-weight:400}
.cover p{margin:10px 0 0}
.cover .tagline{font-family:var(--hand);font-size:27px;line-height:1.15}

/* print/export & misc */
.copybox{width:100%;min-height:150px;font-family:var(--type);font-size:12.5px}
.avopt{border:1.6px solid transparent;background:none;padding:2px;border-radius:50%}
.avopt.on{border-color:var(--ink)}
.chiprow button{cursor:pointer}
.warn{font-size:13px;border-left:3px solid var(--gray);padding:2px 10px;color:#5a534a;margin:8px 0}

@media (max-width:860px){
  body{padding:10px 6px 90px}
  .book{flex-direction:column-reverse;padding:10px 8px;border-radius:8px}
  .tabs{flex-direction:row;overflow-x:auto;width:auto;padding:0 0 8px;gap:4px;scrollbar-width:thin}
  .tab{border:1.5px solid #6e6454;border-bottom:0;border-radius:9px 9px 0 0;margin:0;padding:6px 10px;font-size:18px;white-space:nowrap;width:auto;flex:none;box-shadow:none}
  .tab.on{margin:0}
  .tabs{order:-1}
  .book{flex-direction:column}
  .spread{grid-template-columns:1fr}
  .rings{display:none}
  .page{display:none;min-height:560px;padding:24px 18px 30px;border-radius:4px!important;box-shadow:none!important}
  .page.on{display:block}
  .pager{display:flex;justify-content:space-between;align-items:center;position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:6px 14px;z-index:30;font-family:var(--hand);font-size:20px}
  .pager button{background:none;border:1.4px solid var(--paper);color:var(--paper);font-family:var(--hand);font-size:20px;padding:2px 12px;border-radius:4px}
  .ptitle{font-size:34px}
  .logo small{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <button class="logo" data-act="nav" data-v="home" title="홈으로 돌아가기">TEXT HIP UNIVERSE<small>나의 문학 수첩</small></button>
    <div class="notice">프로토타입 · 서버 없이 이 브라우저에만 저장돼요 · 친구와 문장은 예시 데이터입니다</div>
  </div>
  <div class="book" id="book">
    <div class="spread" id="spread"><div class="rings"></div><div id="pages" style="display:contents"></div></div>
    <nav class="tabs" id="tabs" aria-label="수첩 목차"></nav>
  </div>
</div>
<div class="pager" id="pager"><button data-act="page" data-v="0">◀ 앞 페이지</button><span id="pgind">1 / 2</span><button data-act="page" data-v="1">뒷 페이지 ▶</button></div>
<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="intro" id="intro" hidden>
  <div class="cover">
    <div class="label">
      <h1>TEXT<br>HIP<br>UNIVERSE</h1>
      <p class="tagline">문학으로 연결되는<br>우리의 디지털 수첩</p>

function rot(i){return ((i*37)%7-3)*0.5+'deg'}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1900)}
function persona(){return S.profile.persona?PERSONAS[S.profile.persona]:null}
function fmtDate(d){return d||''}
function tagsHtml(t){return (t||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
function empty(title,desc,btn){return `<div class="empty"><span class="hand">${esc(title)}</span>${esc(desc)}${btn?`<div style="margin-top:8px">${btn}</div>`:''}</div>`}
function stickerSvg(id){
  const st='stroke="#38342F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  switch(id){
   case 'star':return `<svg width="46" height="46" viewBox="0 0 46 46"><path ${st} d="M23 5l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z"/></svg>`;
   case 'arrow':return `<svg width="80" height="34" viewBox="0 0 80 34"><path ${st} d="M3 24c18-16 42-18 70-6M62 8l12 10-15 6"/></svg>`;
   case 'clip':return `<svg width="26" height="64" viewBox="0 0 26 64"><path ${st} d="M8 14v34a6 6 0 0 0 12 0V10a9 9 0 0 0-18 0v40a13 13 0 0 0 22 0V20"/></svg>`;
   case 'circle':return `<svg width="110" height="50" viewBox="0 0 110 50"><path ${st} d="M10 28C6 10 40 4 70 6c28 2 40 14 34 26-6 11-40 14-66 10C16 39 8 34 14 22"/></svg>`;
   case 'tape':return `<div style="width:84px;height:24px;background:rgba(190,176,148,.8);border:1px solid rgba(120,106,80,.4);clip-path:polygon(0 0,100% 6%,97% 50%,100% 94%,0 100%,3% 50%)"></div>`;
   case 'pencil':return `<svg width="90" height="22" viewBox="0 0 90 22"><path ${st} d="M3 11l10-7h70v14H13z M13 4v14 M76 4v14"/></svg>`;
  }return '';
}
const STK_POS={star:'right:28px;top:84px;transform:rotate(12deg)',arrow:'left:40%;top:150px;transform:rotate(-8deg)',clip:'right:46px;top:-10px;transform:rotate(6deg)',circle:'left:26px;bottom:18px;transform:rotate(-4deg)',tape:'left:-14px;top:24px;transform:rotate(-40deg)',pencil:'right:18px;bottom:22px;transform:rotate(-12deg)'};

/* ================= 모달 ================= */
function openModal(html){const m=$('modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;const f=m.querySelector('input[type=text],textarea');if(f)f.focus()}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML=''}
function confirmBox(msg,onYes,yesLabel){
  openModal(`<h3>잠깐, 확인해 주세요</h3><p>${nl(msg)}</p><div class="row" style="margin-top:14px"><button class="btn solid" id="cf-yes">${esc(yesLabel||'네, 진행할게요')}</button><button class="btn" data-act="close">취소</button></div>`);
  $('cf-yes').onclick=()=>{closeModal();onYes()};
}

const VIEWS={};
const TABLIST=[['home','내 수첩'],['persona','페르소나'],['quotes','문장'],['books','책장'],['talk','대화'],['map','지도'],['friends','친구'],['decorate','꾸미기']];

function curRec(){
  const list=ui.recTopic?RECS.filter(r=>r.topic===ui.recTopic):RECS;
  return list[((ui.recIdx%list.length)+list.length)%list.length];
}
function recBox(){
  const r=curRec(), saved=S.savedRecs.includes(r.id);
  return `<div class="note card torn" style="--r:-.6deg"><span class="tape"></span>
   <div class="small">오늘의 문장 · ${esc(r.topic)} <span class="badge">직접 쓴 요약·해석 · 데모</span></div>
   <div class="qt" style="margin-top:6px">${esc(r.text)}</div>
   <div class="cite">『${esc(r.book)}』 · ${esc(r.author)}<br>${esc(r.ctx)}</div>
   <div class="row" style="margin-top:8px">
     <button class="btn sm solid" data-act="rec-save" ${saved?'disabled':''}>${saved?'담았어요':'내 수첩에 담기'}</button>
     <button class="btn sm" data-act="rec-next">다른 문장 보기</button></div>
   <div class="chiprow" style="margin-top:4px"><span class="small">주제: </span>
     <button class="tag ${!ui.recTopic?'on':''}" data-act="rec-topic" data-v="">전체</button>${TOPICS.map(t=>`<button class="tag ${ui.recTopic===t?'on':''}" data-act="rec-topic" data-v="${t}">${t}</button>`).join('')}</div>
   <div class="small" style="margin-top:4px">원문 인용이 아니라 작품 내용을 바탕으로 직접 쓴 문장입니다.</div></div>`;
}

   ${rq.length?rq.map((q,i)=>`<div class="note click" style="--r:${rot(i)}" data-act="quote-open" data-id="${q.id}"><span class="tape l"></span><div class="qt">${esc(q.text)}</div><div class="cite">『${esc(q.book)}』${q.author?' · '+esc(q.author):''}</div></div>`).join(''):empty('문장이 아직 없어요','마음에 든 문장 하나로 수첩을 시작해 보세요.',`<button class="btn" data-act="quote-new">첫 문장 적기</button>`)}
   <h2 class="h3">나의 책장 <button class="more" data-act="nav" data-v="books">전체 보기 →</button></h2>
   ${rb.length?`<div class="row" style="align-items:flex-end">${rb.map(b=>`<div data-act="book-open" data-id="${b.id}" style="cursor:pointer;width:84px"><div class="coverbook" style="width:78px">${esc(b.title)}</div><div class="small">${esc(b.status)}</div></div>`).join('')}</div>`:empty('책장이 비었어요','읽은 책, 읽고 싶은 책을 적어 보세요.',`<button class="btn" data-act="book-new">책 추가</button>`)}
   <h2 class="h3">최근 인물 대화 <button class="more" data-act="nav" data-v="talk">대화 →</button></h2>
   ${rc?`<div class="note click kraft" data-act="talk-open" data-id="${rc.id}" style="--r:.6deg"><b class="hand" style="font-size:22px">${esc(CHARS[rc.charId].name)}</b> <span class="small">${esc(rc.date)}</span><div class="small" style="margin-top:2px">${esc((rc.msgs.filter(m=>m.who==='ch').slice(-1)[0]||{}).text||'').slice(0,60)}…</div></div>`:empty('대화 기록이 없어요','문학 속 인물과 이야기해 보세요.',`<button class="btn" data-act="nav" data-v="talk">인물 만나기</button>`)}
   <h2 class="h3">친구 수첩 책장</h2>
   <div class="shelf">${S.friends.added.map(id=>{const f=FRIENDS.find(x=>x.id===id);return `<button class="spine" data-act="friend-go" data-id="${id}" title="${esc(f.nick)}의 수첩">${esc(f.nick)}</button>`}).join('')||'<span class="small">아직 꽂힌 수첩이 없어요</span>'}
   <button class="spine" style="background:transparent;border-style:dashed" data-act="nav" data-v="friends">＋</button></div>`;
  return [L,R];
};

    L=`<h1 class="ptitle">${pend?'테스트 결과':'나의 문학 페르소나'}</h1>
    <div class="note card" style="--r:-.4deg"><span class="tape"></span>
      <div class="small">${esc(show.alias)}</div><div class="hand" style="font-size:34px;line-height:1.1">${esc(show.name)}</div>
      <div style="margin:6px 0">${show.kw.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
      <dl class="kv"><dt>닮은 인물</dt><dd>${esc(show.char)}</dd><br><dt>작품</dt><dd>『${esc(show.work)}』 · ${esc(show.author)}</dd></dl>
      <p><b class="hand" style="font-size:20px">나와 닮은 이유</b><br>${esc(show.why)}</p>

    <div class="row" style="margin-top:8px">

      ${show.chat?`<button class="btn" data-act="talk-pick" data-id="${show.chat}">${esc(show.char)}와 대화하기</button>`:`<button class="btn" disabled title="이 인물의 대화 시나리오는 아직 준비 중입니다">대화 준비 중</button>`}
    </div>

  }else{
    L=`<h1 class="ptitle">문학 페르소나</h1>${empty('나는 어떤 이야기의 사람일까?','상황형 질문 10개로 나와 닮은 문학 속 인물을 찾아봅니다.',`<button class="btn solid" data-act="persona-start">테스트 시작</button>`)}`;
  }
  let R;
  if(ui.test){
    const t=ui.test,q=QUIZ[t.i];
    R=`<div class="small">문항 ${t.i+1} / ${QUIZ.length}</div><div class="progress"><i style="width:${(t.i)/QUIZ.length*100}%"></i></div>
    <h2 class="hand" style="font-size:30px;line-height:1.2;margin-bottom:10px">${esc(q.q)}</h2>
    ${q.o.map((o,i)=>`<button class="quiz-opt" data-act="persona-ans" data-i="${i}">${esc(o[0])}</button>`).join('')}
    <div class="row" style="margin-top:12px"><button class="linkbtn" data-act="persona-cancel">그만하기</button>${t.i>0?'<button class="linkbtn" data-act="persona-back" style="margin-left:12px">이전 질문</button>':''}</div>`;
  }else{

    ${Object.values(PERSONAS).map((x,i)=>`<div class="note ${p&&p.key===x.key?'kraft':''}" style="--r:${rot(i+2)};margin:7px 4px"><b class="hand" style="font-size:23px">${esc(x.alias)}</b> <span class="small">『${esc(x.work)}』 · ${esc(x.char)}</span><div class="small" style="color:#4a443d">${x.kw.map(esc).join(' · ')}</div></div>`).join('')}

function filteredQuotes(){
  let q=[...S.quotes].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||0);
  if(ui.qTag)q=q.filter(x=>(x.tags||[]).includes(ui.qTag));
  return q;
}

  const q=filteredQuotes();
  const L=`<h1 class="ptitle">문장 수집함</h1>
   <div class="row" style="margin:4px 0 8px"><button class="btn solid" data-act="quote-new">＋ 문장 적기</button></div>
   <div class="chiprow"><button class="tag ${!ui.qTag?'on':''}" data-act="qtag" data-v="">전체 ${S.quotes.length}</button>${TAGS.map(t=>`<button class="tag ${ui.qTag===t?'on':''}" data-act="qtag" data-v="${t}">${t}</button>`).join('')}</div>
   ${q.length?q.map((x,i)=>`<div class="note ${i%3==1?'kraft':'card'} click ${ui.qSel===x.id?'sel':''}" style="--r:${rot(i)}" data-act="quote-sel" data-id="${x.id}"><span class="tape ${i%2?'l':''}"></span>
     <div class="qt">${esc(x.text)}</div><div class="cite">『${esc(x.book)}』${x.author?' · '+esc(x.author):''}${x.from?` · <span class="badge">${esc(x.from)}의 수첩에서</span>`:''}</div><div style="margin-top:4px">${tagsHtml(x.tags)}${x.vis==='friends'?'<span class="badge">친구에게 보임</span>':''}</div></div>`).join('')
    :empty(ui.qTag?'이 태그의 문장이 없어요':'문장이 아직 없어요','읽다가 마음에 든 문장을 적어 보세요.',`<button class="btn" data-act="quote-new">문장 적기</button>`)}`;
  const s=S.quotes.find(x=>x.id===ui.qSel);

    <div class="note card" style="--r:.3deg;padding:18px 18px 14px"><span class="tape"></span>
     <div class="qt" style="font-size:20px">${nl(s.text)}</div>
     <div class="cite">『${esc(s.book)}』${s.author?' · '+esc(s.author):''}${s.page?' · '+esc(s.page):''}</div>
     <div class="small">발견한 날 ${esc(s.date)} ${s.kind==='summary'?'<span class="badge">요약·데모</span>':''}</div>
     <div style="margin:6px 0">${tagsHtml(s.tags)}</div>

    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="quote-edit" data-id="${s.id}">수정</button><button class="btn sm" data-act="quote-card" data-id="${s.id}">문장 카드 미리보기</button><button class="btn sm" data-act="quote-del" data-id="${s.id}">삭제</button></div>

     ${qs.length?qs.map(q=>`<div class="note click" data-act="quote-open" data-id="${q.id}"><div class="qt" style="font-size:15.5px">${esc(q.text)}</div></div>`).join(''):`<div class="small" style="margin:4px">아직 없어요. <button class="linkbtn" data-act="quote-new-book" data-id="${s.id}">이 책의 문장 적기</button></div>`}
     <h3 class="h3">관련 대화 ${cs.length}</h3>

  }
  return [L,R];
};

VIEWS.talk=function(){
  const c=ui.chat;
  const recs=[...S.conversations].reverse();
  const L=`<h1 class="ptitle">문학 속 대화</h1>
   <div class="sub">대화할 인물을 골라 보세요</div>

/* 지도 */
function buildMap(){
  const nodes=[],edges=[];const p=persona();
  const C={id:'me',type:'persona',label:p?p.alias:S.profile.nick,x:300,y:260,r:44};nodes.push(C);
  const ring1=[];
  S.books.forEach(b=>ring1.push({id:'b'+b.id,type:'book',label:b.title,ref:b}));
  const chars=new Set(S.conversations.map(c=>c.charId));if(p&&p.chat)chars.add(p.chat);
  chars.forEach(id=>ring1.push({id:'c'+id,type:'char',label:CHARS[id].name,ref:CHARS[id]}));
  const ring2=[];
  S.quotes.forEach(q=>ring2.push({id:'q'+q.id,type:'quote',label:q.text.length>11?q.text.slice(0,11)+'…':q.text,ref:q}));
  const tc={};S.quotes.forEach(q=>(q.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,5).forEach(t=>ring2.push({id:'t'+t,type:'tag',label:'#'+t,ref:t}));
  const place=(arr,rx,ry,off)=>arr.forEach((n,i)=>{const a=off+i/arr.length*Math.PI*2;n.x=300+Math.cos(a)*rx;n.y=260+Math.sin(a)*ry;nodes.push(n)});
  place(ring1,150,115,-Math.PI/2);
  place(ring2,250,210,-Math.PI/2+.25);
  const get=id=>nodes.find(n=>n.id===id);
  ring1.forEach(n=>edges.push([ 'me',n.id,n.type==='char'?'닮은/대화':'수집' ]));
  S.quotes.forEach(q=>{const b=S.books.find(x=>x.title.trim()===q.book.trim());if(b)edges.push(['b'+b.id,'q'+q.id]);else edges.push(['me','q'+q.id]);
    (q.tags||[]).forEach(t=>{if(get('t'+t))edges.push(['q'+q.id,'t'+t])})});
  chars.forEach(id=>{const b=S.books.find(x=>x.title===CHARS[id].work);if(b)edges.push(['b'+b.id,'c'+id])});
  return {nodes,edges,get};
}
const NCOL={persona:'#38342F',book:'#D8CBB5',char:'#efe7d4',quote:'#fffdf7',tag:'#F3EFE6'};
VIEWS.map=function(){
  const m=buildMap();
  let svg=`<svg class="map" viewBox="0 0 600 520" width="100%" role="img" aria-label="나의 문학 지도">`;
  m.edges.forEach(([a,b])=>{const A=m.get(a),B=m.get(b);if(!A||!B)return;const mx=(A.x+B.x)/2+((A.y-B.y)%17)*0.6,my=(A.y+B.y)/2+((B.x-A.x)%13)*0.6;
    svg+=`<path d="M${A.x} ${A.y}Q${mx} ${my} ${B.x} ${B.y}" fill="none" stroke="#8A8379" stroke-width="1.4" stroke-dasharray="${B.type==='tag'?'2 5':'6 4'}"/>`});
  m.nodes.forEach(n=>{
    const sel=ui.mapSel===n.id, fill=NCOL[n.type], tc=n.type==='persona'?'#F3EFE6':'#38342F';
    const lab=n.label.length>9?n.label.slice(0,9)+'…':n.label;
    svg+=`<g class="node ${sel?'sel':''}" data-act="map-sel" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}">`;
    if(n.type==='persona')svg+=`<circle class="shape" cx="${n.x}" cy="${n.y}" r="44" fill="${fill}" stroke="#38342F" stroke-width="${sel?3.2:2}"/><text x="${n.x}" y="${n.y-2}" text-anchor="middle" font-size="19" style="fill:#F3EFE6">${esc(lab.slice(0,5))}</text><text x="${n.x}" y="${n.y+17}" text-anchor="middle" font-size="16" style="fill:#F3EFE6">${esc(lab.slice(5))||'나'}</text>`;
    else if(n.type==='book')svg+=`<rect class="shape" x="${n.x-34}" y="${n.y-22}" width="68" height="44" fill="${fill}" stroke="#38342F" stroke-width="2" transform="rotate(${(n.x%5)-2} ${n.x} ${n.y})"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="17">${esc(lab)}</text>`;
    else if(n.type==='char')svg+=`<ellipse class="shape" cx="${n.x}" cy="${n.y}" rx="38" ry="22" fill="${fill}" stroke="#38342F" stroke-width="2"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="18">${esc(lab)}</text>`;
    else if(n.type==='quote')svg+=`<rect class="shape" x="${n.x-38}" y="${n.y-16}" width="76" height="32" fill="${fill}" stroke="#8A8379" stroke-width="1.6" transform="rotate(${(n.y%7)-3} ${n.x} ${n.y})"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="14">${esc(lab)}</text>`;
    else svg+=`<text class="shape" x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="19" style="text-decoration:underline">${esc(lab)}</text>`;
    svg+='</g>';
  });
  svg+='</svg>';
  const L=`<h1 class="ptitle">나의 문학 지도</h1><div class="sub">기록할수록 연결이 늘어나요</div>
   <div class="mapbox">${svg}</div>
   <div class="legend"><span>● 나의 페르소나</span><span>▭ 책</span><span>⬭ 문학 인물</span><span>▱ 문장</span><span>#태그</span></div>`;
  const n=ui.mapSel&&m.get(ui.mapSel);
  let R=`<h2 class="h3" style="margin-top:0">노드를 눌러 보세요</h2>`;
  if(!n){R+=empty('지도 속 이름 하나를 골라 보세요','연결선은 책 · 문장 · 인물 · 태그 사이의 관계를 보여 줘요.')+`<div class="small" style="margin:8px 4px">노드 ${m.nodes.length}개 · 연결 ${m.edges.length}개. 책이나 문장을 추가하면 이곳에 바로 나타나요.</div><div class="row"><button class="btn sm" data-act="book-new">책 추가</button><button class="btn sm" data-act="quote-new">문장 적기</button></div>`}
  else if(n.type==='persona'){const p=persona();R+=p?`<div class="note card"><b class="hand" style="font-size:28px">${esc(p.name)}</b><div>${p.kw.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div><p class="small">${esc(p.why)}</p></div><button class="btn sm" data-act="nav" data-v="persona">페르소나 보기</button>`:empty('페르소나가 없어요','테스트로 찾아보세요.',`<button class="btn" data-act="nav" data-v="persona">찾기</button>`)}
  else if(n.type==='book'){const b=n.ref;R+=`<div class="note card"><b class="hand" style="font-size:28px">『${esc(b.title)}』</b><div class="small">${esc(b.author)} · ${esc(b.status)}</div>${b.review?`<p>${esc(b.review)}</p>`:''}</div><div class="row"><button class="btn sm" data-act="book-open" data-id="${b.id}">책장에서 보기</button></div>`}
  else if(n.type==='char'){const c=n.ref;R+=`<div class="note card"><b class="hand" style="font-size:28px">${esc(c.name)}</b><div class="small">『${esc(c.work)}』 · ${esc(c.era)}</div><p>${esc(c.trait)}.</p><div class="small">주요 갈등: ${esc(c.conflict)}</div></div><div class="row"><button class="btn sm" data-act="talk-pick" data-id="${c.id}">대화하기</button></div>`}
  else if(n.type==='quote'){const q=n.ref;R+=`<div class="note card"><div class="qt">${esc(q.text)}</div><div class="cite">『${esc(q.book)}』 · ${esc(q.author)}</div>${tagsHtml(q.tags)}</div><div class="row"><button class="btn sm" data-act="quote-open" data-id="${q.id}">문장 수집함에서 보기</button></div>`}
  else{const t=n.ref,qs=S.quotes.filter(q=>(q.tags||[]).includes(t));R+=`<div class="note card"><b class="hand" style="font-size:28px">#${esc(t)}</b><div class="small">이 마음과 이어진 문장 ${qs.length}개</div>${qs.map(q=>`<div class="small" style="margin-top:4px">· ${esc(q.text)}</div>`).join('')}</div><div class="row"><button class="btn sm" data-act="qtag-go" data-v="${esc(t)}">이 태그로 모아 보기</button></div>`}
  return [L,R];
};

  $('tabs').innerHTML=TABLIST.map(([k,n])=>`<button class="tab ${ui.view===k?'on':''}" data-act="nav" data-v="${k}" ${ui.view===k?'aria-current="page"':''}>${n}</button>`).join('');
  const [L,R]=VIEWS[ui.view]();
  $('pages').innerHTML=`<section class="page L ${ui.page===0?'on':''}" aria-label="앞 페이지">${L}</section><section class="page R ${ui.page===1?'on':''}" aria-label="뒷 페이지">${R}</section>`;
  $('pgind').textContent=(ui.page+1)+' / 2';
  const sp=$('spread');
  if(turn){sp.classList.remove('turn');void sp.offsetWidth;sp.classList.add('turn')}
  const cb=$('chatbox');if(cb)cb.scrollTop=cb.scrollHeight;
}
function go(v,page){ui.view=v;ui.page=page||0;try{history.replaceState(null,'','#'+v)}catch(e){}render(true);window.scrollTo({top:0})}

/* ================= 폼 모달 ================= */

   <label for="qb">책 제목<span class="req">*</span></label><input type="text" id="qb" name="book" required maxlength="40" value="${esc(q.book||preBook||'')}" list="booklist"><datalist id="booklist">${S.books.map(b=>`<option value="${esc(b.title)}">`).join('')}</datalist>
   <div class="grid2"><div><label for="qa">작가<span class="opt">선택</span></label><input type="text" id="qa" name="author" maxlength="30" value="${esc(q.author||'')}"></div>

   <label for="qt">나의 생각·감상<span class="opt">선택</span></label><textarea id="qt" name="thought" maxlength="300" style="min-height:64px">${esc(q.thought||'')}</textarea>
   <label>감정 태그</label><div class="chiprow">${TAGS.map(t=>`<label style="display:inline;margin:0"><input class="sr" type="checkbox" name="tag" value="${t}" ${tags.includes(t)?'checked':''}><span class="tag tgl" style="cursor:pointer">${t}</span></label>`).join('')}</div>
   <div class="small" style="margin-top:6px">※ 저작권이 있는 책의 긴 문장은 짧게, 또는 내 말로 요약해서 적어 주세요.</div>

function syncTgl(){document.querySelectorAll('#modal input[type=checkbox]').forEach(c=>{const t=c.nextElementSibling;if(t)t.classList.toggle('on',c.checked)})}
function bookForm(b,pre){

function exportText(){
  const p=persona();
  let t=`[${S.profile.coverTitle}] ${S.profile.nick} — ${S.profile.bio}\n`;
  if(p)t+=`페르소나: ${p.alias} (${p.name})\n`;
  t+=`\n# 문장 ${S.quotes.length}\n`+S.quotes.map(q=>`- ${q.text} — 『${q.book}』${q.author?' '+q.author:''}${q.thought?'\n  생각: '+q.thought:''}`).join('\n');
  t+=`\n\n# 책장 ${S.books.length}\n`+S.books.map(b=>`- 『${b.title}』 ${b.author||''} (${b.status})`).join('\n');
  t+=`\n\n# 대화 ${S.conversations.length}\n`+S.conversations.map(c=>`- ${CHARS[c.charId].name} (${c.date})${c.note?' “'+c.note+'”':''}`).join('\n');
  return t;
}

/* ================= 대화 로직 ================= */
function startChat(id){ui.chat={charId:id,id:null,msgs:[{who:'ch',text:CHARS[id].greet}],saved:[]}}
function reply(ch,text){
  const t=text.replace(/\s/g,'');let best=null,sc=0;
  ch.sc.forEach(s=>{let n=0;s.k.forEach(k=>{if(t.includes(k))n++});if(n>sc){sc=n;best=s}});
  if(best)return best.a;
  const fb=FALLBACK[ch.id];return fb[(ui.chat.msgs.length>>1)%fb.length];
}
function persistChat(){
  const c=ui.chat;if(!c)return;
  if(c.id){const r=S.conversations.find(x=>x.id===c.id);if(r){r.msgs=c.msgs.slice();r.saved=c.saved.slice();return}}
  c.id=uid();S.conversations.push({id:c.id,charId:c.charId,date:today(),msgs:c.msgs.slice(),saved:c.saved.slice(),note:'',vis:'me'});
}

   if(t.i>=QUIZ.length){const sc={LP:0,HG:0,CH:0,HM:0,EB:0,AL:0};t.ans.forEach((a,qi)=>{const w=QUIZ[qi].o[a][1];for(const k in w)sc[k]+=w[k]});

   else render()},

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  ev.preventDefault();
  fn({v:el.dataset.v,id:el.dataset.id,i:el.dataset.i,f:el.dataset.f});
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('modal').hidden){closeModal();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button][data-act]')){ev.preventDefault();ev.target.click()}
});
document.addEventListener('change',ev=>{
  if(ev.target.matches('#modal input[type=checkbox]'))syncTgl();
  if(ev.target.name==='av'){document.querySelectorAll('.avopt').forEach(l=>l.classList.toggle('on',l.contains(ev.target)&&ev.target.checked))}
});
$('modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal')closeModal()});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  const d=new FormData(f),k=f.dataset.form;
  if(k==='quote'){
    const text=(d.get('text')||'').trim(),book=(d.get('book')||'').trim();
    if(!text||!book){toast('문장과 책 제목은 꼭 필요해요');return}
    const obj={text,book,author:(d.get('author')||'').trim(),page:(d.get('page')||'').trim(),date:d.get('date')||today(),thought:(d.get('thought')||'').trim(),vis:d.get('vis')==='friends'?'friends':'me',tags:d.getAll('tag')};
    const id=f.dataset.id;
    if(id){const q=S.quotes.find(x=>x.id===id);const kind=q.kind;Object.assign(q,obj);q.kind=kind;ui.qSel=id}
    else{obj.id=uid();S.quotes.push(obj);ui.qSel=obj.id;ui.qTag=null}
    save();closeModal();ui.page=ui.view==='quotes'?ui.page:ui.page;render();toast(id?'문장을 고쳤어요':'문장을 수첩에 붙였어요');
  }else if(k==='book'){
    const title=(d.get('title')||'').trim();if(!title){toast('책 제목은 꼭 필요해요');return}
    const obj={title,author:(d.get('author')||'').trim(),status:d.get('status'),review:(d.get('review')||'').trim(),keywords:(d.get('keywords')||'').trim()};
    const id=f.dataset.id;
    if(id){Object.assign(S.books.find(x=>x.id===id),obj);ui.bSel=id}else{obj.id=uid();S.books.push(obj);ui.bSel=obj.id}
    save();closeModal();render();toast(id?'책을 고쳤어요':'책장에 꽂았어요');
  }else if(k==='talk-free'){
    const t=(d.get('t')||'').trim();if(!t)return;
    const ch=CHARS[ui.chat.charId];ui.chat.msgs.push({who:'me',text:t},{who:'ch',text:reply(ch,t)});
    if(ui.chat.id){persistChat();save()}render();
  }else if(k==='talk-note'){
    const r=S.conversations.find(x=>x.id===ui.chat.id);r.note=(d.get('t')||'').trim();save();closeModal();render();toast('한 줄 감상을 남겼어요');
  }else if(k==='comment'){
    const t=(d.get('t')||'').trim();if(!t){toast('댓글 내용을 적어 주세요');return}
    S.comments.push({id:uid(),fid:f.dataset.f,author:S.profile.nick,text:t,date:today(),mine:true});save();render();toast('댓글을 붙였어요');
  }else if(k==='profile'){
    const nick=(d.get('nick')||'').trim();if(!nick){toast('닉네임을 적어 주세요');return}
    S.profile.nick=nick;S.profile.bio=(d.get('bio')||'').trim();S.profile.coverTitle=(d.get('cover')||'').trim()||'나의 문학 수첩';S.profile.avatar=+(d.get('av')||0);
    save();render();toast('수첩 표지를 저장했어요');
  }
});

(function init(){
  const h=(location.hash||'').replace('#','');
  if(VIEWS[h])ui.view=h;
  if(!S.meta.seen)$('intro').hidden=false;
  window.addEventListener('hashchange',()=>{const v=(location.hash||'').replace('#','');if(VIEWS[v]&&v!==ui.view){ui.view=v;ui.page=0;render(true)}});
  render();
})();
</script>
